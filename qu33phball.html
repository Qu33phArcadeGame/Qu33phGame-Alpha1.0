<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Qu33ph Skee-Ball</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; font-family:Helvetica,Arial,sans-serif; color:#fff; touch-action:none; user-select:none; background:#000; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage{ position:relative; }
  #laneBtn{ position:fixed; left:10px; bottom:14px; z-index:6; padding:7px 12px; border-radius:9px;
    background:rgba(8,9,16,0.82); border:1px solid rgba(255,255,255,0.34); color:#fff;
    font-family:Helvetica,Arial,sans-serif; font-size:11px; font-weight:bold; letter-spacing:1px;
    cursor:pointer; -webkit-tap-highlight-color:transparent; }
  #laneBtn:disabled{ opacity:0.35; }
  #game{ display:block; }

</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="game"></canvas></div></div>
<button id="laneBtn"></button>
<script>
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const sc=document.createElement('canvas'), s2=sc.getContext('2d');   // cabinet layer, takes the theme filter
const THEME=(new URLSearchParams(location.search).get('theme')||'default').toLowerCase();
// Two lanes. CLASSIC is the original board, untouched; LONG is the new one — a
// longer run with tighter cups and a 333 at the back lip.
const FIELDS=[
 // Full uncropped renders, so the neighbouring cabinet stays in frame — switching
 // machines reads as sliding one lane over. Both are 0.5625 aspect, so PH is 178.
 // Every coordinate below is a fraction of the WHOLE frame, and because the machine
 // sits off to one side in each shot, the board centre (cx) is not 0.5.
 { id:'classic', name:'CLASSIC', art:'skeefield.jpg?v=384', PH:178,
   start:{x:0.490,y:0.860}, queueY:0.775, dur:46, shrink:0.55,
   pullDiv:0.46, aimDiv:0.28, cx:0.523, aimSpan:0.175, aimScat:0.95,
   baseY:0.505, powY:0.265, jitterX:0.059, jitterY:0.062,
   scat:function(p){ return 0.55+Math.abs(p-0.70)*1.5; }, overFrom:2, overK:0,
   rects:[
     // centre column, contiguous bands so nothing drops through a crack
     {x0:0.473,x1:0.573,y0:0.205,y1:0.278,p:50 },
     {x0:0.473,x1:0.573,y0:0.278,y1:0.308,p:40 },
     {x0:0.473,x1:0.573,y0:0.308,y1:0.345,p:30 },
     {x0:0.473,x1:0.573,y0:0.345,y1:0.380,p:20 },
     {x0:0.473,x1:0.573,y0:0.380,y1:0.420,p:10 },
     // corner barrels
     {x0:0.357,x1:0.430,y0:0.240,y1:0.300,p:100},
     {x0:0.623,x1:0.698,y0:0.240,y1:0.300,p:100},
     // inside the rings
     {x0:0.334,x1:0.721,y0:0.265,y1:0.430,p:10 }
   ],
   bestKey:'qu33phSkeeballBest' },

 { id:'advanced', name:'ADVANCED', art:'skeefield2.jpg?v=384', PH:178,
   start:{x:0.490,y:0.880}, queueY:0.790, dur:48, shrink:0.58,
   pullDiv:0.46, aimDiv:0.28, cx:0.443, aimSpan:0.256, aimScat:1.15,
   baseY:0.560, powY:0.320, jitterX:0.043, jitterY:0.048,
   scat:function(p){ return 0.55+Math.abs(p-0.74)*1.2+Math.max(0,p-0.80)*4.5; },
   overFrom:0.84, overK:7,
   rects:[
     // chairs first — they catch it before anything else and lob it into the 75
     {x0:0.247,x1:0.338,y0:0.462,y1:0.575,p:75,chair:1,tox:0.2245,toy:0.399},
     {x0:0.564,x1:0.658,y0:0.462,y1:0.575,p:75,chair:1,tox:0.6715,toy:0.399},
     // back row
     {x0:0.270,x1:0.313,y0:0.268,y1:0.316,p:50 },
     {x0:0.322,x1:0.393,y0:0.265,y1:0.313,p:100},
     {x0:0.431,x1:0.455,y0:0.264,y1:0.292,p:333},
     {x0:0.498,x1:0.566,y0:0.265,y1:0.313,p:100},
     {x0:0.592,x1:0.633,y0:0.268,y1:0.316,p:50 },
     // mid row
     {x0:0.285,x1:0.354,y0:0.346,y1:0.386,p:30 },
     {x0:0.411,x1:0.480,y0:0.346,y1:0.386,p:40 },
     {x0:0.538,x1:0.603,y0:0.346,y1:0.386,p:30 },
     // side pockets
     {x0:0.200,x1:0.249,y0:0.356,y1:0.442,p:75 },
     {x0:0.644,x1:0.699,y0:0.356,y1:0.442,p:75 },
     // apron
     {x0:0.255,x1:0.630,y0:0.320,y1:0.470,p:10 }
   ],
   bestKey:'qu33phSkeeballBest2' }
];
let fieldIdx=0;
try{ const k=localStorage.getItem('qu33phSkeeField'); if(k==='advanced') fieldIdx=1; }catch(e){}
// the arcade menu can hand us the lane directly
{ const q=(new URLSearchParams(location.search).get('lane')||'').toLowerCase();
  if(q==='advanced') fieldIdx=1; else if(q==='classic') fieldIdx=0; }
function F(){ return FIELDS[fieldIdx]; }
const FIELD=new Image();
function loadField(){ FIELD.src=F().art; }
loadField();
const MK={ red:new Image(), green:new Image(), blue:new Image() };
const CMC=(THEME==='cartoon');
MK.red.src=CMC?'redC.png':'red.png'; MK.green.src=CMC?'greenC.png':'green.png'; MK.blue.src=CMC?'blueC.png':'blue.png';
function ready(im){ return im&&im.complete&&im.naturalWidth>0; }

const PW=100;
function PH(){ return F().PH; }    // each lane has its own length
let CW=0,CH=0,DPR=1,SC=1;
function sz(){ const r=document.getElementById('wrap').getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1);
  const ar=PW/PH(); let cw=r.width,ch=r.width/ar; if(ch>r.height){ch=r.height;cw=r.height*ar;}
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const st=document.getElementById('stage'); if(st){ st.style.width=cw+'px'; st.style.height=ch+'px'; }
  CW=Math.round(cw*DPR); CH=Math.round(ch*DPR); cv.width=CW; cv.height=CH; sc.width=CW; sc.height=CH; SC=CW/PW; }
sz();
window.addEventListener('resize',()=>{ try{ sz(); FIELDC=null; }catch(e){} });
// ---- themes: the cabinet gets the filter, the markers keep their colour ----
const TH={
  'default':{name:'DEFAULT',     filter:'',                                          glow:null},
  'cartoon':{name:'COMIC',       filter:'grayscale(1) contrast(1.2)',                glow:null, benday:true},
  'neon':   {name:'NEON',        filter:'saturate(1.6) brightness(1.08)',            glow:'#28ff82'},
  'sunset': {name:'GOLDEN HOUR', filter:'sepia(0.5) saturate(1.7) brightness(1.12)', glow:'#ffb020'},
  'galaxy': {name:'GALAXY',      filter:'hue-rotate(215deg) saturate(1.4)',          glow:'#9a6bff', galaxies:true}
}[THEME] || {name:'DEFAULT', filter:'', glow:null};
const CANFILTER=(function(){ try{ const t=document.createElement('canvas').getContext('2d'); t.filter='grayscale(1)'; return t.filter==='grayscale(1)'; }catch(e){ return false; } })();
let BEND=null, BENDkey=0;
function bendayPattern(c, ds){
  ds=Math.max(6, Math.round(ds));
  if(BEND && BENDkey===ds) return BEND;
  const t=document.createElement('canvas');
  t.width=ds; t.height=ds*2;
  const g=t.getContext('2d');
  g.fillStyle='rgba(20,20,20,0.45)';
  const r=Math.max(1, ds*0.16);
  // staggered rows, drawn once into a tile instead of thousands of arcs every frame
  const pts=[[0,0],[ds,0],[0,ds*2],[ds,ds*2],[ds*0.5,ds]];
  for(const p of pts){ g.beginPath(); g.arc(p[0],p[1],r,0,6.283); g.fill(); }
  BEND=c.createPattern(t,'repeat'); BENDkey=ds;
  return BEND;
}
const MK_GLOW={red:'#ff3b3b',green:'#39ff6a',blue:'#4f9dff'};
function glowFor(kind){
  if(!TH.glow) return null;
  if(THEME==='neon'){ if(kind==='coin') return '#ffd700'; if(MK_GLOW[kind]) return MK_GLOW[kind]; }
  return TH.glow;
}
function glowOn(c,kind){
  const g=glowFor(kind);
  if(g){ c.shadowColor=g; c.shadowBlur=CH*(THEME==='neon'?0.020:0.016); }
}
function glowOff(c){ c.shadowBlur=0; c.shadowColor='transparent'; }
// sporadic stars, constellations and slow spirals — no grid, nothing that reads like ben-day
let STARS=null, CONSTEL=null;
function buildSky(){
  STARS=[]; CONSTEL=[];
  for(let i=0;i<70;i++) STARS.push({x:Math.random(),y:Math.random(),r:0.4+Math.random()*1.5,p:Math.random()*6.283});
  for(let k=0;k<3;k++){
    const cx=0.15+Math.random()*0.7, cy=0.10+Math.random()*0.7, pts=[];
    for(let i=0;i<3+((Math.random()*3)|0);i++)
      pts.push({x:cx+(Math.random()-0.5)*0.22, y:cy+(Math.random()-0.5)*0.20});
    CONSTEL.push(pts);
  }
}
function drawSky(c){
  if(!STARS) buildSky();
  const t=Date.now()/1000;
  c.save();
  for(const st of STARS){
    c.globalAlpha=0.35+0.5*Math.abs(Math.sin(t*0.9+st.p));
    c.fillStyle='#fff'; c.beginPath(); c.arc(st.x*CW, st.y*CH, st.r*(CH/900), 0, 6.283); c.fill();
  }
  c.globalAlpha=0.35; c.strokeStyle='rgba(190,165,255,0.75)'; c.lineWidth=Math.max(1,CH*0.0013);
  for(const pts of CONSTEL){
    c.beginPath();
    pts.forEach((p,i)=> i? c.lineTo(p.x*CW,p.y*CH) : c.moveTo(p.x*CW,p.y*CH));
    c.stroke();
    c.fillStyle='rgba(220,205,255,0.9)';
    for(const p of pts){ c.beginPath(); c.arc(p.x*CW,p.y*CH,CH*0.0022,0,6.283); c.fill(); }
  }
  c.globalAlpha=1;
  for(let i=0;i<3;i++){                                  // slow spiral galaxies
    const R=CH*(0.06+0.03*(i%2));
    const gx=CW*(0.16+0.34*i), gy=CH*(0.08+0.10*i);
    c.save(); c.translate(gx,gy); c.rotate(t*(0.09+0.04*i)*(i%2?-1:1));
    const g=c.createRadialGradient(0,0,0,0,0,R);
    g.addColorStop(0,'rgba(235,215,255,0.5)'); g.addColorStop(0.4,'rgba(150,90,255,0.20)'); g.addColorStop(1,'rgba(90,40,160,0)');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,R,0,6.283); c.fill();
    c.strokeStyle='rgba(200,170,255,0.28)'; c.lineWidth=Math.max(1,R*0.05);
    for(let arm=0;arm<2;arm++){
      c.beginPath();
      for(let q=0;q<=24;q++){ const th=arm*Math.PI+q*0.14, rr=R*0.12+(q/24)*R*0.9;
        const px=Math.cos(th)*rr, py=Math.sin(th)*rr*0.42;
        q? c.lineTo(px,py) : c.moveTo(px,py); }
      c.stroke();
    }
    c.restore();
  }
  c.restore();
}
function drawThemeOverlay(){
  if(TH.benday) return;                                 // dots are baked into the cached cabinet
  if(TH.galaxies){ ctx.save(); ctx.globalCompositeOperation='screen'; drawSky(ctx); ctx.restore(); }
  if(TH.glow){
    const g=ctx.createRadialGradient(CW/2,CH*0.5,CH*0.18,CW/2,CH*0.5,CH*0.78);
    const c=TH.glow==='#28ff82'?'40,255,130':TH.glow==='#ffb020'?'255,176,32':'150,90,255';
    g.addColorStop(0,'rgba('+c+',0)'); g.addColorStop(1,'rgba('+c+',0.26)');
    ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH); ctx.restore();
  }
}

// If the field art hasn't been made yet, paint the scoring regions straight from
// the table. Same numbers the scorer uses, so it doubles as a live layout guide —
// drop the PNG in and this never renders again.
const FB_COL={333:'#ffd246',100:'#dc9628',75:'#3cbe78',50:'#be3c3c',40:'#c83c3c',30:'#3c78dc',10:'#1e2028'};
function drawBoardFallback(g){
  const f=F();
  if(!f.rects) return;
  g.textAlign='center'; g.textBaseline='middle';
  for(let i=f.rects.length-1;i>=0;i--){          // apron is last in the list, so paint it first
    const r=f.rects[i];
    const x=r.x0*CW, y=r.y0*CH, w=(r.x1-r.x0)*CW, h=(r.y1-r.y0)*CH;
    g.fillStyle=FB_COL[r.p]||'#444'; g.fillRect(x,y,w,h);
    g.lineWidth=Math.max(1,CW*0.004); g.strokeStyle='rgba(255,255,255,0.85)'; g.strokeRect(x,y,w,h);
    g.fillStyle='#fff'; g.font='bold '+Math.round(Math.min(h*0.5,CW*0.055))+'px Helvetica,Arial,sans-serif';
    g.fillText(String(r.p), x+w/2, y+h/2);
  }
}
function X(u){ return u*SC; }                 // field-units -> px
function fx(f){ return f*CW; }                 // field-fraction x -> px
function fy(f){ return f*CH; }                 // field-fraction y -> px

const QSLOTS=8, QX0=0.325, QSPAN=0.35;         // fixed slots so the row never shuffles
const COLORS=['red','green','blue'];          // cycle order
const TOTAL=9, LAND_HOLD=20, FEED_DUR=16;

// curIdx = the marker in play; resolved = how many have finished.
// The waiting queue is always (QSLOTS - curIdx) long, in every state, so nothing pops in or out.
let curIdx, resolved, score, best, state, ball, popups, landT, feed;
function loadBest(){ try{ best=parseInt(localStorage.getItem(F().bestKey)||'0',10)||0; }catch(e){ best=0; } }
loadBest();   // each lane keeps its own record, since they don't score alike
function qx(k){ return QX0 + ((k-1)/(QSLOTS-1))*QSPAN; }   // marker k (1..8) owns a fixed slot
function colOf(i){ return COLORS[i%3]; }                    // 0 red, 1 green, 2 blue, 3 red ...

function reset(){ curIdx=0; resolved=0; score=0; state='ready'; ball=null; popups=[]; landT=0; feed=null; }
reset();

// ── lane switch: only between rolls, and it restarts the game, since the two
//    boards don't score alike and a mixed card would be meaningless ──────────
const laneBtn=document.getElementById('laneBtn');
function updLaneBtn(){
  laneBtn.textContent='LANE \u00b7 '+F().name;
  laneBtn.disabled=(state!=='ready'&&state!=='over');
}
laneBtn.addEventListener('click',function(e){
  e.stopPropagation();
  if(state!=='ready'&&state!=='over') return;
  fieldIdx=(fieldIdx+1)%FIELDS.length;
  try{ localStorage.setItem('qu33phSkeeField',F().id); }catch(e2){}
  loadField(); loadBest(); reset(); sz(); updLaneBtn();
});
updLaneBtn();

// ---- flick input ----
let dragging=false, dStart=null, dNow=null;
function pt(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height }; }
cv.addEventListener('pointerdown',e=>{ if(state==='over'){ reset(); return; } if(state!=='ready') return; dragging=true; dStart=pt(e); dNow=dStart; });
cv.addEventListener('pointermove',e=>{ if(dragging) dNow=pt(e); });
window.addEventListener('pointerup',()=>{ if(!dragging) return; dragging=false;
  const dx=dNow.x-dStart.x, dy=dNow.y-dStart.y;                 // flick UP = negative dy
  const up=Math.max(0,-dy);                                     // upward pull
  if(up<0.04){ dStart=dNow=null; return; }                     // too small, ignore
  roll(up, dx);
  dStart=dNow=null;
});

function roll(up, dx){
  const f=F();
  const power=Math.min(1, up/f.pullDiv);
  const aim=Math.max(-1,Math.min(1, dx/f.aimDiv));
  // On the long lane scatter is a U on power AND grows with angle, so a hard cross-lane
  // roll is the least controllable shot there is. The classic lane keeps its old curve.
  const scat=f.scat(power)+Math.abs(aim)*f.aimScat;
  const landX=(f.cx!==undefined?f.cx:0.50) + aim*f.aimSpan + (Math.random()-0.5)*f.jitterX*scat;
  let   landY=f.baseY - power*f.powY + (Math.random()-0.5)*f.jitterY*scat;
  // long lane only: bury it and the marker climbs the backboard and comes back empty
  // clamped, so even a full-power mash still gets through occasionally
  const over=(power>f.overFrom && Math.random() < Math.min(0.85,(power-f.overFrom)*(f.overK||7)));
  if(over) landY=-0.05;
  ball={ x0:f.start.x, y0:f.start.y, x1:landX, y1:landY, t:0, dur:f.dur,
         color:colOf(curIdx), spin:0, scored:false, over:over };
  state='rolling';
}

let lastHitChair=null;
function scoreLanding(lx,ly){
  const f=F();
  // GAUNTLET scores by rectangle, in listed order — holes first, apron last
  if(f.rects){
    for(const r of f.rects) if(lx>=r.x0&&lx<=r.x1&&ly>=r.y0&&ly<=r.y1){
      lastHitChair=r.chair?{x:r.tox,y:r.toy}:null;   // a chair catches it and kicks it into the 75
      return r.p;
    }
    lastHitChair=null;
    return 0;
  }
  // CLASSIC keeps its cups-and-rings model
  const R=f.ring;
  let b2=null,bd=1e9;
  for(const z of f.zones){ const d=Math.hypot(lx-z.x,ly-z.y); if(d<bd){ bd=d; b2=z; } }
  if(b2 && bd < b2.r*f.cupTol) return b2.p;
  const dx=(lx-R.cx)/R.w10, dy=(ly-R.cy)/R.h10;
  if(dx*dx+dy*dy <= 1) return 10;
  return 0;
}

function step(){
  if(state==='rolling' && ball){
    ball.t++; ball.spin+=0.4;
    if(ball.t>=ball.dur){
      ball.t=ball.dur;                                  // marker stays put at the hole
      const pts=scoreLanding(ball.x1,ball.y1); score+=pts; resolved++;
      // a chair catch reads as its own thing, and the popup shows up at the pocket
      const chair=lastHitChair;
      popups.push({x:chair?chair.x:ball.x1, y:chair?chair.y:ball.y1,
                   txt:chair?'CHAIR +75':(pts>0?('+'+pts):'MISS'), life:chair?66:52, pts:pts});
      if(lastHitChair){ ball.x1=lastHitChair.x; ball.y1=lastHitChair.y; }   // bounced up into the 75
      state='landed'; landT=0;                          // score/miss shows now, marker still visible
    }
  } else if(state==='landed'){
    landT++;
    if(landT>=LAND_HOLD){
      ball=null;
      if(resolved>=TOTAL){
        state='over';
        if(score>best){ best=score; try{ localStorage.setItem(F().bestKey,best); }catch(e){} }
      } else {
        curIdx++;                                       // next marker leaves the queue...
        feed={ t:0, dur:FEED_DUR, fromX:qx(curIdx), color:colOf(curIdx) };
        state='feed';                                   // ...and travels down to the roll spot
      }
    }
  } else if(state==='feed' && feed){
    feed.t++;
    if(feed.t>=feed.dur){ feed=null; state='ready'; }
  }
  for(let i=popups.length-1;i>=0;i--){ popups[i].life--; popups[i].y-=0.0015; if(popups[i].life<=0) popups.splice(i,1); }
}

function ease(t){ return 1-Math.pow(1-t,2); }   // ease-out

function drawMarker(color, cx, cy, scale, rot){
  const img=MK[color], w=X(11)*scale, h=X(11)*scale;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot); glowOn(ctx,color);
  if(ready(img)){ const ar=img.naturalWidth/img.naturalHeight; ctx.drawImage(img,-w/2,-w/(2*ar),w,w/ar); }
  else { ctx.fillStyle=(color==='red'?'#ff3030':color==='green'?'#30d060':'#3a7bff'); ctx.beginPath(); ctx.arc(0,0,w*0.45,0,7); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=X(0.5); ctx.stroke(); }
  glowOff(ctx); ctx.restore();
}

let FIELDC=null, fieldcKey='';
function ensureFieldCache(){
  const key=CW+'x'+CH+'|'+THEME+'|'+F().id+'|'+(ready(FIELD)?1:0);
  if(FIELDC && fieldcKey===key) return;
  FIELDC=document.createElement('canvas'); FIELDC.width=CW; FIELDC.height=CH;
  const g=FIELDC.getContext('2d');
  s2.setTransform(1,0,0,1,0,0); s2.clearRect(0,0,CW,CH);
  if(ready(FIELD)) s2.drawImage(FIELD,0,0,CW,CH);
  else { s2.fillStyle='#111'; s2.fillRect(0,0,CW,CH); drawBoardFallback(s2); }
  if(CANFILTER && TH.filter) g.filter=TH.filter;
  g.drawImage(sc,0,0);
  g.filter='none';
  if(THEME==='neon'){                                   // bloom baked in so the machine glows
    g.save(); g.globalCompositeOperation='screen'; g.globalAlpha=0.30; g.drawImage(sc,0,0);
    g.globalAlpha=0.16; g.filter='blur(6px)'; g.drawImage(sc,0,0); g.filter='none'; g.restore();
  }
  if(TH.benday){
    g.save(); g.globalCompositeOperation='multiply';
    g.fillStyle=bendayPattern(g, CH*0.015); g.fillRect(0,0,CW,CH); g.restore();
  }
  fieldcKey=key;
}
function draw(){
  updLaneBtn();
  ctx.setTransform(1,0,0,1,0,0);
  ensureFieldCache();
  ctx.drawImage(FIELDC,0,0);                            // static cabinet: one blit per frame
  drawThemeOverlay();
  // HUD numbers in the field's BALLS / SCORE / HIGH SCORE boxes
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#ffffff';
  ctx.font='bold '+Math.round(CW*0.05)+'px Helvetica';
  ctx.fillText(TOTAL-resolved, fx(0.346), fy(0.1937));
  ctx.fillText(score,          fx(0.502), fy(0.1937));
  ctx.fillText(best,           fx(0.662), fy(0.1937));

  // preview queue — each marker keeps its own slot, so the row never reshuffles
  ctx.globalAlpha=0.38;
  for(let k=curIdx+1; k<TOTAL; k++) drawMarker(colOf(k), fx(qx(k)), fy(F().queueY), 0.5, 0);
  ctx.globalAlpha=1;

  // the next marker travelling down from the queue to the roll spot
  if(state==='feed' && feed){
    const t=ease(feed.t/feed.dur);
    const cx=fx(feed.fromX+(F().start.x-feed.fromX)*t);
    const cy=fy(F().queueY+(F().start.y-F().queueY)*t);
    ctx.globalAlpha=0.38+0.62*t;
    drawMarker(feed.color, cx, cy, 0.5+0.5*t, 0);
    ctx.globalAlpha=1;
  }

  // current marker on the roll spot
  if(state==='ready') drawMarker(colOf(curIdx), fx(F().start.x), fy(F().start.y), 1.0, 0);

  // rolling marker — stays on screen the whole way up the lane and rests at the hole
  if((state==='rolling'||state==='landed') && ball){
    const t=ease(Math.min(1, ball.t/ball.dur));
    const cx=fx(ball.x0+(ball.x1-ball.x0)*t);
    const cy=fy(ball.y0+(ball.y1-ball.y0)*t);
    const sc=1.0 - t*(F().shrink||0.45);            // shrinks with distance up the lane
    let al=1;
    if(state==='landed'){ const k=landT/LAND_HOLD; al = k<0.6 ? 1 : 1-(k-0.6)/0.4; }  // sinks in at the end
    ctx.globalAlpha=Math.max(0,al);
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(cx,cy+X(2)*sc,X(5)*sc,X(2)*sc,0,0,7); ctx.fill();
    drawMarker(ball.color, cx, cy, sc, ball.spin);
    ctx.globalAlpha=1;
  }

  // score popups
  for(const p of popups){ ctx.globalAlpha=Math.max(0,p.life/40);
    ctx.fillStyle=p.pts>=100?'#ffd24a':p.pts>=30?'#7bff9a':p.pts>0?'#8fd0ff':'#ff7a7a';
    ctx.font='bold '+Math.round(CW*0.055)+'px Helvetica'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=X(0.8); ctx.strokeText(p.txt,fx(p.x),fy(p.y)); ctx.fillText(p.txt,fx(p.x),fy(p.y)); ctx.globalAlpha=1; }

  // hint
  if(state==='ready' && !dragging){ ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='bold '+Math.round(CW*0.035)+'px Helvetica'; ctx.textAlign='center';
    ctx.fillText(F().rects?'flick UP to roll \u2014 soft and wide for the pockets':'flick UP to roll \u2014 aim for the rings', CW/2, fy(0.93)); }

  // game over
  if(state==='over'){ ctx.fillStyle='rgba(0,0,0,0.66)'; ctx.fillRect(0,0,CW,CH);
    ctx.textAlign='center'; ctx.fillStyle='#e23b3b'; ctx.font='bold '+Math.round(CW*0.1)+'px Helvetica'; ctx.fillText('GAME OVER',CW/2,CH*0.42);
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(CW*0.08)+'px Helvetica'; ctx.fillText('SCORE '+score,CW/2,CH*0.50);
    ctx.font='bold '+Math.round(CW*0.045)+'px Helvetica'; ctx.fillText('BEST '+best,CW/2,CH*0.555);
    ctx.fillText('tap to play again',CW/2,CH*0.62); }
}

function loop(){ step(); draw(); requestAnimationFrame(loop); }
window.addEventListener('resize',()=>{ sz(); });
loop();
</script>
</body>
</html>
