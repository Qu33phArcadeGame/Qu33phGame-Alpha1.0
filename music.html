<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Qu33ph Music</title>
<style>
/* nobody gets to long-press/right-click-save any image in this app — the
   long-press "download/copy image" context menu on Android/iOS specifically
   comes from -webkit-touch-callout, so that's the one that actually matters
   on mobile; the rest are backup layers for desktop browsers. */
img,video{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-user-drag:none;-khtml-user-drag:none;-moz-user-select:none;-ms-user-select:none;
  pointer-events:auto;}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;}

/* exact same marker-cap back button used everywhere else in the app */
.marker-btn{position:fixed;top:9px;left:22px;z-index:3000;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3c3c3c 0%,#161616 46%,#000 100%);color:#fff;
  border:2.5px solid #fff;border-radius:4px 9px 9px 4px;
  font-family:Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:bold;letter-spacing:1px;
  padding:5px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 3px 0 rgba(0,0,0,0.55),0 6px 10px rgba(0,0,0,0.4),inset 0 1.5px 0 rgba(255,255,255,0.4),inset 0 -4px 7px rgba(0,0,0,0.45);
  transform:translateY(0);transition:transform 0.08s ease,box-shadow 0.08s ease;}
.marker-btn::before{content:"";position:absolute;left:-15px;top:2px;bottom:2px;width:15px;
  background:linear-gradient(180deg,#3c3c3c 0%,#161616 46%,#000 100%);border:2.5px solid #fff;border-radius:8px 2px 2px 8px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.35),inset 0 -3px 5px rgba(0,0,0,0.45);}
.marker-btn:active{background:linear-gradient(180deg,#161616 0%,#000 100%);transform:translateY(3px);
  box-shadow:0 0 0 rgba(0,0,0,0.55),0 1px 3px rgba(0,0,0,0.4),inset 0 2px 6px rgba(0,0,0,0.6);}
.marker-btn:active::before{background:linear-gradient(180deg,#161616 0%,#000 100%);box-shadow:inset 0 2px 5px rgba(0,0,0,0.6);}

.wrap{height:100%;display:flex;flex-direction:column;padding:8px 8px 0;box-sizing:border-box;}
h1{margin:34px 0 2px;text-align:center;font-size:clamp(16px,4.2vw,22px);letter-spacing:2px;
  color:#ffd24a;text-shadow:0 0 10px rgba(255,210,74,.5);}
.sub{text-align:center;font-size:10px;color:#888;letter-spacing:1px;margin-bottom:8px;}

.instr-row{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-shrink:0;}
.instr-btn{background:linear-gradient(180deg,#222,#0a0a0a);border:2px solid #444;color:#999;
  font-size:11px;font-weight:bold;letter-spacing:1.5px;padding:8px 14px;border-radius:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;}
.instr-btn.active{border-color:#ffd24a;color:#ffd24a;background:linear-gradient(180deg,#3a2f0e,#1a1608);
  box-shadow:0 0 10px rgba(255,210,74,.4);}

#recWrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;flex-shrink:0;}
.tbtn{border:2px solid #666;background:linear-gradient(180deg,#2a2a2a,#0d0d0d);color:#fff;
  font-size:11px;font-weight:bold;letter-spacing:1px;padding:9px 14px;border-radius:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;}
.tbtn.rec{border-color:#ff4d4d;color:#ff8080;}
.tbtn.rec.on{background:linear-gradient(180deg,#5a1414,#2a0808);color:#fff;animation:pulse 1s infinite;}
.tbtn.play{border-color:#4dafff;color:#8ecfff;}
.tbtn.done{border-color:#4dff8a;color:#7bffa8;}
.tbtn.reset{border-color:#777;color:#999;font-size:10px;padding:6px 10px;}
.tbtn:disabled{opacity:0.35;cursor:default;animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 4px rgba(255,60,60,.5);}50%{box-shadow:0 0 16px rgba(255,60,60,.9);}}
#timer{font-family:'Courier New',monospace;font-size:13px;color:#ccc;min-width:42px;text-align:center;}

#layerPanel{display:none;flex-shrink:0;margin-bottom:6px;}
#waveCanvas{display:block;width:100%;height:50px;background:#0a0a0c;border:1px solid #2a2a2e;border-radius:6px;}
#layerInfo{text-align:center;font-size:10px;color:#888;letter-spacing:1px;margin:4px 0 6px;}
.layer-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}

#downloadArea{text-align:center;margin-bottom:6px;min-height:0;flex-shrink:0;}
#downloadArea a{display:inline-block;background:linear-gradient(180deg,#ffdd66,#e8a83c);color:#241300;
  font-weight:bold;font-size:12px;letter-spacing:1px;padding:9px 20px;border-radius:8px;text-decoration:none;
  box-shadow:0 4px 10px rgba(0,0,0,.4);}
#encodeStatus{text-align:center;font-size:11px;color:#ffd24a;margin-bottom:6px;flex-shrink:0;}

.keyboard-wrap{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  border-top:2px solid #222;padding-top:6px;min-height:0;}
.keyboard{display:flex;align-items:flex-end;height:100%;padding:0 8px 10px;gap:3px;width:max-content;}
.key{position:relative;width:42px;height:88%;max-height:230px;border-radius:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .05s ease,filter .05s ease;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
.key img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));}
.key .note{position:relative;z-index:2;font-size:8px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;
  opacity:0.65;pointer-events:none;}
.key.down{transform:translateY(6px) scale(0.96);filter:brightness(1.35);}
</style>
</head>
<body>
<script>
// belt-and-suspenders against saving/copying images — the CSS touch-callout
// rule above is what actually stops the mobile long-press menu; this catches
// the desktop right-click case and any image the CSS somehow missed.
document.addEventListener('contextmenu', function(e){
  var t = e.target;
  if(t && (t.tagName==='IMG' || t.tagName==='VIDEO')) e.preventDefault();
});
document.addEventListener('dragstart', function(e){
  var t = e.target;
  if(t && (t.tagName==='IMG' || t.tagName==='VIDEO')) e.preventDefault();
});
</script>

<button class="marker-btn" onclick="location.href='season2.html'">&larr; BACK</button>
<div class="wrap">
  <h1>QU33PH MUSIC</h1>
  <div class="sub">pick an instrument, play the keyboard, record a track</div>

  <div class="instr-row" id="instrRow">
    <button class="instr-btn active" data-kind="throw" onclick="setInstrument('throw',this)">THROW</button>
    <button class="instr-btn" data-kind="peef" onclick="setInstrument('peef',this)">PEEF</button>
    <button class="instr-btn" data-kind="hit" onclick="setInstrument('hit',this)">HIT</button>
  </div>

  <div class="instr-row" id="octRow">
    <button class="instr-btn active" onclick="setOctave(0,this)">OCTAVE 1</button>
    <button class="instr-btn" onclick="setOctave(1,this)">OCTAVE 2</button>
    <button class="instr-btn" onclick="setOctave(2,this)">OCTAVE 3</button>
  </div>

  <div id="recWrap">
    <button class="tbtn rec" id="recBtn" onclick="toggleRecord()">&#9899; RECORD</button>
    <span id="timer">0:00</span>
  </div>

  <div id="layerPanel">
    <canvas id="waveCanvas"></canvas>
    <div id="layerInfo">0/3 layers</div>
    <div class="layer-actions">
      <button class="tbtn play" id="playAddBtn" onclick="playAndAddLayer()">&#9654; PLAY &amp; ADD LAYER</button>
      <button class="tbtn done" id="exportBtn" onclick="exportMp3()">&#11015; EXPORT MP3</button>
      <button class="tbtn reset" id="resetBtn" onclick="resetAll()">&#8634; START OVER</button>
    </div>
  </div>

  <div id="encodeStatus"></div>
  <div id="downloadArea"></div>

  <div class="keyboard-wrap"><div class="keyboard" id="keyboard"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<script>
// ── sound sources — real files already used elsewhere in the app ──────────
const SOUND_FILES={ throw:'vertical1.m4a', peef:'verticalpeef1.m4a', hit:'hitc1.m4a' };
const KEY_IMG=['stackred.png','stackgreen.png','stackblue.png']; // red, green, blue — repeating
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEYS_PER_OCTAVE=12;
// three full octaves, one shown at a time via the OCTAVE 1/2/3 switch
const OCTAVE_BASES=[-12,0,12];
let currentOctave=0;

let currentKind='throw';
let audioCtx=null, buffers={}, loading={};
let recDest=null;

// ── layers ──────────────────────────────────────────────────────────────
// each layer is an independently-recorded, CLEAN take — reference playback
// of earlier layers during an overdub goes to the speakers only, never back
// into the recorder, so mixing at export time is just summing buffers with
// no quality loss from re-recording earlier layers over and over
let layers=[];                 // [{buffer:AudioBuffer}, ...]  max 3
let mediaRecorder=null, recordedChunks=[], recording=false, recordStartT=0, timerInt=null;
let referenceSource=null, lastMp3Url=null;

function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    recDest=audioCtx.createMediaStreamDestination();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function loadBuffer(kind){
  if(buffers[kind]) return Promise.resolve(buffers[kind]);
  if(loading[kind]) return loading[kind];
  loading[kind]=fetch(SOUND_FILES[kind]).then(r=>r.arrayBuffer())
    .then(arr=>audioCtx.decodeAudioData(arr))
    .then(buf=>{ buffers[kind]=buf; return buf; })
    .catch(err=>{ console.warn('sound load failed for',kind,err); return null; });
  return loading[kind];
}

function setInstrument(kind,el){
  currentKind=kind;
  document.getElementById('instrRow').querySelectorAll('.instr-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  ensureAudio();
  loadBuffer(kind);
}
function setOctave(idx,el){
  currentOctave=idx;
  document.getElementById('octRow').querySelectorAll('.instr-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  buildKeyboard();
}

async function playNote(semitone,keyEl){
  ensureAudio();
  const buf=await loadBuffer(currentKind);
  if(!buf) return;
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  src.playbackRate.value=Math.pow(2,semitone/12);
  const gain=audioCtx.createGain();
  gain.gain.value=0.9;
  src.connect(gain);
  gain.connect(audioCtx.destination);
  gain.connect(recDest); // always wired to the recorder — only matters while actually recording
  src.start();
  if(keyEl){ keyEl.classList.add('down'); setTimeout(()=>keyEl.classList.remove('down'),120); }
}

function buildKeyboard(){
  const kb=document.getElementById('keyboard');
  kb.innerHTML='';
  const start=OCTAVE_BASES[currentOctave];
  for(let i=0;i<KEYS_PER_OCTAVE;i++){
    const semitone=start+i;
    const key=document.createElement('div');
    key.className='key';
    const img=document.createElement('img');
    img.src=KEY_IMG[i%3]; // same note = same color across every octave
    img.alt='';
    const note=document.createElement('span');
    note.className='note';
    const noteIdx=((semitone%12)+12)%12;
    const octave=4+Math.floor((semitone+9)/12);
    note.textContent=NOTE_NAMES[noteIdx]+octave;
    key.appendChild(img); key.appendChild(note);
    key.addEventListener('pointerdown',e=>{ e.preventDefault(); playNote(semitone,key); });
    kb.appendChild(key);
  }
}
buildKeyboard();

// ── recording / layers ─────────────────────────────────────────────────
function toggleRecord(){
  ensureAudio();
  if(!recording) startRecording(); else stopRecording();
}
function startRecording(){
  recordedChunks=[];
  try{ mediaRecorder=new MediaRecorder(recDest.stream); }
  catch(e){ alert("Recording isn't supported in this browser."); return; }
  mediaRecorder.ondataavailable=e=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.start();
  recording=true;
  recordStartT=Date.now();
  const recBtn=document.getElementById('recBtn');
  recBtn.textContent='\u23F9 STOP';
  recBtn.classList.add('on');
  document.getElementById('recWrap').style.display='flex';
  document.getElementById('playAddBtn').disabled=true;
  document.getElementById('exportBtn').disabled=true;
  document.getElementById('downloadArea').innerHTML='';
  document.getElementById('encodeStatus').textContent='';
  timerInt=setInterval(updateTimer,200);
}
function stopRecording(){
  if(!mediaRecorder) return;
  clearInterval(timerInt);
  recording=false;
  const recBtn=document.getElementById('recBtn');
  recBtn.textContent='\u26AB RECORD';
  recBtn.classList.remove('on');
  if(referenceSource){ try{ referenceSource.stop(); }catch(e){} referenceSource=null; }

  // IMPORTANT: MediaRecorder delivers its data asynchronously when stop()
  // finishes — waiting for onstop (instead of checking recordedChunks right
  // after calling stop()) is what fixes the export button never lighting up
  mediaRecorder.onstop=async ()=>{
    if(recordedChunks.length>0){
      try{
        const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||'audio/webm'});
        const arrBuf=await blob.arrayBuffer();
        const buf=await audioCtx.decodeAudioData(arrBuf.slice(0));
        layers.push({buffer:buf});
        if(layers.length>3) layers=layers.slice(0,3);
      }catch(err){ console.error(err); }
    }
    refreshUI();
  };
  mediaRecorder.stop();
}
function updateTimer(){
  const s=Math.floor((Date.now()-recordStartT)/1000);
  document.getElementById('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function playAndAddLayer(){
  if(layers.length>=3 || recording) return;
  ensureAudio();
  const mix=mixLayers();
  if(mix){
    const src=audioCtx.createBufferSource();
    src.buffer=mix;
    src.connect(audioCtx.destination); // reference only — NOT routed into recDest
    src.start();
    referenceSource=src;
  }
  startRecording();
}

function mixLayers(){
  if(layers.length===0) return null;
  if(layers.length===1) return layers[0].buffer;
  const sr=layers[0].buffer.sampleRate;
  const maxLen=Math.max.apply(null, layers.map(l=>l.buffer.length));
  const numCh=Math.max.apply(null, layers.map(l=>l.buffer.numberOfChannels));
  const mixed=audioCtx.createBuffer(numCh,maxLen,sr);
  for(let ch=0; ch<numCh; ch++){
    const out=mixed.getChannelData(ch);
    layers.forEach(l=>{
      const src=l.buffer.getChannelData(Math.min(ch,l.buffer.numberOfChannels-1));
      for(let i=0;i<src.length;i++) out[i]+=src[i];
    });
    for(let i=0;i<out.length;i++) out[i]=Math.max(-1,Math.min(1,out[i]));
  }
  return mixed;
}

function drawWaveform(buf){
  const canvas=document.getElementById('waveCanvas');
  const cssW=canvas.clientWidth||300;
  canvas.width=cssW*2; canvas.height=100;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!buf) return;
  const data=buf.getChannelData(0);
  const barW=3, bars=Math.floor(canvas.width/barW);
  const step=Math.max(1,Math.floor(data.length/bars));
  ctx.fillStyle='#ffd24a';
  for(let i=0;i<bars;i++){
    let mn=1,mx=-1;
    for(let j=0;j<step;j++){
      const idx=i*step+j; if(idx>=data.length) break;
      const v=data[idx]; if(v<mn) mn=v; if(v>mx) mx=v;
    }
    const y1=(1-mx)*0.5*canvas.height, y2=(1-mn)*0.5*canvas.height;
    ctx.fillRect(i*barW, y1, barW-1, Math.max(2,y2-y1));
  }
}

function refreshUI(){
  const recWrap=document.getElementById('recWrap');
  const panel=document.getElementById('layerPanel');
  if(recording){
    recWrap.style.display='flex';
    return;
  }
  if(layers.length===0){
    recWrap.style.display='flex';
    panel.style.display='none';
    return;
  }
  recWrap.style.display='none';
  panel.style.display='block';
  document.getElementById('layerInfo').textContent=layers.length+'/3 layers';
  drawWaveform(mixLayers());
  const playBtn=document.getElementById('playAddBtn');
  playBtn.disabled = layers.length>=3;
  playBtn.style.display = layers.length>=3 ? 'none' : 'inline-flex';
  document.getElementById('exportBtn').disabled=false;
}

function resetAll(){
  layers=[];
  document.getElementById('downloadArea').innerHTML='';
  document.getElementById('encodeStatus').textContent='';
  refreshUI();
}

// ── export — mixes every layer down into one real MP3 file, encoded fully
// in-browser with lamejs (no server involved) ──────────────────────────
function floatTo16BitPCM(f32){
  const out=new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){
    const s=Math.max(-1,Math.min(1,f32[i]));
    out[i]=s<0?s*0x8000:s*0x7FFF;
  }
  return out;
}
async function exportMp3(){
  if(layers.length===0) return;
  const statusEl=document.getElementById('encodeStatus');
  const exportBtn=document.getElementById('exportBtn');
  exportBtn.disabled=true;
  statusEl.textContent='Encoding...';
  await new Promise(r=>setTimeout(r,30));

  try{
    const mixed=mixLayers();
    const ch0=floatTo16BitPCM(mixed.getChannelData(0));
    const ch1=mixed.numberOfChannels>1 ? floatTo16BitPCM(mixed.getChannelData(1)) : ch0;
    const channels=mixed.numberOfChannels>1?2:1;
    const encoder=new lamejs.Mp3Encoder(channels, mixed.sampleRate, 128);
    const mp3Data=[];
    const blockSize=1152;
    for(let i=0;i<ch0.length;i+=blockSize){
      const l=ch0.subarray(i,i+blockSize);
      const r=ch1.subarray(i,i+blockSize);
      const buf=channels>1 ? encoder.encodeBuffer(l,r) : encoder.encodeBuffer(l);
      if(buf.length>0) mp3Data.push(buf);
    }
    const end=encoder.flush();
    if(end.length>0) mp3Data.push(end);

    const mp3Blob=new Blob(mp3Data, {type:'audio/mp3'});
    if(lastMp3Url) URL.revokeObjectURL(lastMp3Url);
    lastMp3Url=URL.createObjectURL(mp3Blob);

    const a=document.createElement('a');
    a.href=lastMp3Url;
    a.download='qu33ph-music-track.mp3';
    a.textContent='\u2B07 DOWNLOAD MP3';
    document.getElementById('downloadArea').innerHTML='';
    document.getElementById('downloadArea').appendChild(a);
    statusEl.textContent='Done!';
  }catch(err){
    console.error(err);
    statusEl.textContent='Something went wrong encoding that — try again.';
  }
  exportBtn.disabled=false;
}

refreshUI();
</script>
</body>
</html>
