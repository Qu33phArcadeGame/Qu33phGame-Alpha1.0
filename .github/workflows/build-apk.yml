name: Build QU33PH APK

# Builds the Android app on GitHub's servers on every push that touches
# the app or this workflow. Download the APK from the run's Artifacts.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --project-dir android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qu33ph-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
