<!DOCTYPE html>

<title>Qu33ph Bowling</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:absolute;inset:0;overflow:hidden;}
  #bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;}
  #cv{position:absolute;top:0;left:0;display:block;}
  /* Mirror mode: flip the whole page with one CSS transform. Bowling has no HTML
     menu — everything (including all text) draws on the canvas, and mtext() in
     the script already draws each string pre-mirrored so it comes out readable
     once this outer flip is applied. */
  body.qmirror{ transform:scaleX(-1); }
</style>

<body>
<style>
  .game-back-tl{ position:fixed; top:9px; left:22px; z-index:99999;
    display:inline-flex; align-items:center; justify-content:center;
    background:#000; color:#fff; border:2.5px solid #fff; border-radius:4px 9px 9px 4px;
    font-family:Helvetica,Arial,sans-serif; font-size:9.5px; font-weight:bold; letter-spacing:1px;
    padding:5px 10px; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  .game-back-tl::before{ content:""; display:block; position:absolute; left:-15px; top:2px; bottom:2px;
    width:15px; background:#000; border:2.5px solid #fff; border-radius:8px 2px 2px 8px; }
</style>
<a id="gameBackBtn" class="game-back-tl" href="index.html?openArcade=1">&larr; BACK</a>
<div id="wrap">
  <img id="bg" src="bowling.jpg?v=378" draggable="false" onerror="this.style.opacity=0.12">
  <canvas id="cv"></canvas>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  QU33PH BOWLING
//  Roll a marker down the lane at ten markers standing on their caps.
//  A marker's cap end is wider than its tail, so it never rolls straight —
//  you play the hook. Blue is always thrown last.
// ═══════════════════════════════════════════════════════════════════════════

// ─── lane geometry, measured off the cabinet art ──────────────────────────
// All normalised 0-1 against the CONTAIN-fitted background image, so they
// stay locked to the artwork at any screen size. Nudge these if the lane
// drifts off the painted wood.
// Every one of these was measured off the field art, not guessed. The lane edges were
// traced out to the gutters at 14 depths and least-squares fitted to the perspective
// model (rms 0.0017), and the centre is confirmed twice over — the aiming arrows and
// the ball-return lights independently agree on 0.490.
const ART_W=2556, ART_H=3840;
const NEAR_Y=0.830, NEAR_HW=0.395;      // foul line (nearest edge of the wood)
const LANE_CX=0.4900;                   // centre arrow — the lane is NOT centred on the art
const FAR_Y =0.360, FAR_HW =0.094;      // pin deck (where the lane goes dark)
const RET_Y =0.866;                     // the row of lights in the ball return
const RET_X0=0.2600, RET_X1=0.7240;     // first and last light centres
const HS_X=0.591, HS_Y=0.2585;          // just past the painted "High Score:" label
const BOX_L=0.233, BOX_R=0.752, BOX_Y=0.2585, BOX_W=0.070;   // the two speaker boxes

// ─── themes: same five looks, same rules as every other cabinet ───────────
const THEME=(new URLSearchParams(location.search).get('theme')||'default').toLowerCase();
// These match themeFilter() in the hub exactly, so the bowling cabinet reads the same
// as pinball and jump do — neon is the green hue-rotate, not a separate magenta look.
const LOOK={
  'default':{filter:'', wash:null, dots:false,stars:false,ink:'#ffffff',accent:'#ffd54a',glow:null, vig:0},
  // hard black-and-white under a printed halftone
  'cartoon':{filter:'grayscale(1) contrast(1.85) brightness(1.10)',
             wash:null, dots:true, stars:false,ink:'#ffffff',accent:'#ffffff',glow:'#ffffff',vig:0.28},
  // the arcade's neon: hue-rotate 95deg is what turns every cabinet that electric green
  'neon':   {filter:'hue-rotate(95deg) saturate(2.3) brightness(1.12) contrast(1.18)',
             wash:'rgba(0,70,36,0.20)', dots:false,stars:false,ink:'#b9ffd6',accent:'#28ff82',glow:'#28ff82',vig:0.34},
  // golden hour: bright and molten, not hazy
  'sunset': {filter:'sepia(0.5) saturate(1.9) brightness(1.22) hue-rotate(-8deg) contrast(1.20)',
             wash:'rgba(255,140,20,0.14)', dots:false,stars:false,ink:'#fff3dc',accent:'#ffc83c',glow:'#ffd24a',vig:0.30},
  // deep space purple with the starfield reading clearly on top
  'galaxy': {filter:'hue-rotate(230deg) saturate(1.7) brightness(0.86) contrast(1.30)',
             wash:'rgba(16,4,64,0.34)', dots:false,stars:true, ink:'#e7e2ff',accent:'#b892ff',glow:'#b892ff',vig:0.40}
};
const T=LOOK[THEME]||LOOK['default'];
const COMIC=(THEME==='cartoon');
document.getElementById('bg').style.filter=T.filter;

// ─── marker art ───────────────────────────────────────────────────────────
function IMG(src){ const i=new Image(); i.src=src; return i; }
// Same art and the same convention Qu33ph Stack uses: these markers are drawn
// upright in their source, so rotation 0 is a marker standing on its cap.
const MPREF=COMIC?'comic':'stack';
function keyWhite(im){
  try{
    const c=document.createElement('canvas'); c.width=im.naturalWidth||im.width; c.height=im.naturalHeight||im.height;
    if(!c.width||!c.height) return im;
    const g=c.getContext('2d',{willReadFrequently:true}); g.drawImage(im,0,0);
    const d=g.getImageData(0,0,c.width,c.height), p=d.data;
    for(let i=0;i<p.length;i+=4){
      if(!p[i+3]) continue;
      const mx=Math.max(p[i],p[i+1],p[i+2]), mn=Math.min(p[i],p[i+1],p[i+2]);
      if(mx-mn<30){                                  // neutral pixel: white matte, not coloured art
        if(mn>=232) p[i+3]=0;
        else if(mn>202) p[i+3]=Math.min(p[i+3], Math.round((232-mn)*(255/30)));
      }
    }
    g.putImageData(d,0,0);
    c.naturalWidth=c.width; c.naturalHeight=c.height; c.complete=true;
    return c;
  }catch(e){ return im; }
}
function thickenOutline(src,r){
  const w=src.naturalWidth||src.width, h=src.naturalHeight||src.height;
  if(!w||!h) return src;
  const sil=document.createElement('canvas'); sil.width=w; sil.height=h;
  const sg=sil.getContext('2d'); sg.drawImage(src,0,0);
  sg.globalCompositeOperation='source-in'; sg.fillStyle='#141414'; sg.fillRect(0,0,w,h);
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const og=out.getContext('2d');
  for(let i=0;i<16;i++){ const a=i/16*6.2832; og.drawImage(sil,Math.cos(a)*r,Math.sin(a)*r); }
  og.drawImage(src,0,0);
  out.naturalWidth=w; out.naturalHeight=h; out.complete=true;
  return out;
}
function keyAndThicken(im){ const k=keyWhite(im); return thickenOutline(k, Math.max(2, Math.min(k.width||k.naturalWidth,k.height||k.naturalHeight)*0.030)); }
const MK={};
['red','green','blue'].forEach(function(k){
  const im=new Image();
  im.onload=function(){ if(COMIC) MK[k]=keyAndThicken(im); };
  im.src=MPREF+k+'.png'; MK[k]=im;
});
const CHAIR=IMG('Chair.png');
const MEGACARD=IMG('megacard.png?v=365');
function ready(i){ return i && i.complete && (i.naturalWidth||i.width)>0; }

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let mirrorMode=false;
try{
  var _qsp=new URLSearchParams(location.search);
  if(_qsp.has('mirror')) mirrorMode=(_qsp.get('mirror')==='on');
  else mirrorMode=(localStorage.getItem('qu33phMirror')==='on');
}catch(e){}
if(mirrorMode) document.body.classList.add('qmirror');
// text now mirrors along with everything else (the outer CSS flip handles it) —
// this just calls the plain native methods so every existing mtext() call site
// keeps working unchanged
function mtext(c,txt,x,y,strokeFirst){
  if(strokeFirst) c.strokeText(txt,x,y);
  c.fillText(txt,x,y);
}
let CW=0,CH=0,DPR=1;
// the background is object-fit:contain, so work out the letterboxed art box
let AX=0,AY=0,AW=0,AH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  CW=window.innerWidth; CH=window.innerHeight;
  cv.style.width=CW+'px'; cv.style.height=CH+'px';
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const s=Math.min(CW/ART_W,CH/ART_H);
  AW=ART_W*s; AH=ART_H*s; AX=(CW-AW)/2; AY=(CH-AH)/2;
  starCv=null;
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120));
// art-space normalised → screen pixels
function ax(n){ return AX+AW*n; }
function ay(n){ return AY+AH*n; }

// ─── lane projection ──────────────────────────────────────────────────────
// Lane space: u across (-1 left gutter .. +1 right gutter), v down (0 foul .. 1 pin deck).
// Reciprocal-depth scaling gives a true perspective narrowing.
const K=NEAR_HW/FAR_HW-1;
const S1=FAR_HW/NEAR_HW;
function scaleAt(v){ return 1/(1+v*K); }
function proj(u,v){
  const s=scaleAt(v);
  return { x: ax(LANE_CX+u*NEAR_HW*s),
           y: ay(NEAR_Y+(FAR_Y-NEAR_Y)*(1-s)/(1-S1)),
           s: s };
}
// physical lane units for collision (u,v are display; X,Y are metric)
const LANE_LEN=7.0;
function toX(u){ return u; }
function toU(X){ return X; }
function toY(v){ return v*LANE_LEN; }
function toV(Y){ return Y/LANE_LEN; }

// ─── pins: ten markers standing on their caps ─────────────────────────────
// A pin stands on its cap, so its footprint really is a small circle. The marker you
// roll lies flat, so it's a long capsule — and which way it points depends on the
// orientation you picked, which is why FLAT sweeps wide and VERT slips through gaps.
const PIN_R=0.080, BALL_R=0.076;          // BALL_R is the capsule's half-WIDTH
const BALL_HL=0.165;                      // capsule half-length
// screen rotation 0 = pointing down the lane, PI/2 = lying across it
function ballAxis(rot){ return { x:Math.sin(rot), y:Math.cos(rot) }; }
// nearest point on the marker's length to a circle, then a normal circle test
function capsuleHit(ball, cx, cy, r){
  const a=ballAxis(ball.rot);
  let t=(cx-ball.X)*a.x+(cy-ball.Y)*a.y;
  t=Math.max(-BALL_HL,Math.min(BALL_HL,t));
  const px=ball.X+a.x*t, py=ball.Y+a.y*t;
  const dx=cx-px, dy=cy-py, d=Math.hypot(dx,dy);
  if(d>=r+BALL_R||d<=0.0001) return null;
  return { nx:dx/d, ny:dy/d, d:d };
}
// how far the marker reaches sideways, for the gutter test
function ballHalfWidth(rot){ return Math.abs(Math.sin(rot))*BALL_HL+BALL_R; }
const PIN_D=0.215, ROW_D=0.325, HEAD_Y=5.95;
const PIN_LAYOUT=[
  [0,0],
  [-PIN_D,1],[PIN_D,1],
  [-2*PIN_D,2],[0,2],[2*PIN_D,2],
  [-3*PIN_D,3],[-PIN_D,3],[PIN_D,3],[3*PIN_D,3]
];
// head pin is blue; the rest alternate so the triangle reads clearly
const PIN_COL=['blue','red','green','red','green','red','green','red','green','red'];

let pins=[];
function rackPins(keep){
  pins=PIN_LAYOUT.map(function(p,i){
    const alive = keep? (keep.indexOf(i)>=0) : true;
    return { i:i, X:p[0], Y:HEAD_Y+p[1]*ROW_D, vx:0, vy:0,
             col:PIN_COL[i], down:false, gone:!alive, rot:0, vrot:0, sink:0 };
  });
}

// ─── frames, queue and scoring ────────────────────────────────────────────
let queue=[];            // ten markers, one per frame — blue always last
let frame=0, roll=0;     // roll 0 = first ball of the frame
let rolls=[];            // pins felled, in order, for standard scoring
let ball=null, phase='aim', msg=null, msgT=0, gameOver=false;
let aimX=0;                              // where the next marker is spotted
let chair=null;                          // tenth frame only, sat in front of the rack
let megaBox='left', megaWon=false, megaFly=null;
const CHAIR_Y=HEAD_Y-0.62, CHAIR_R=0.135;
const MEGA_CHANCE=0.42;                  // otherwise the chair just barrels into the rack
let standingAtFrameStart=10;

function newGame(){
  // always red, green, red, green ... and blue last. Never shuffled, never theme-dependent.
  queue=['red','green','red','green','red','green','red','green','red','blue'];
  frame=0; roll=0; rolls=[]; gameOver=false; aimX=0;
  megaBox=Math.random()<0.5?'left':'right'; megaWon=false; megaFly=null; chair=null;
  rackPins(null); ball=null; phase='aim'; msg=null;
  chair=null;
  standingAtFrameStart=10;
}

function standing(){ let n=0; for(const p of pins) if(!p.gone && !p.down) n++; return n; }
// A washout: the headpin's down, but pins are still standing on BOTH sides of the
// lane centre — the classic hard-to-convert leave, distinct from an ordinary 6.
function isWashout(){
  if(!pins[0].down) return false;
  let left=false, right=false;
  for(const p of pins){ if(p.gone||p.down) continue; if(p.X<-0.001) left=true; else if(p.X>0.001) right=true; }
  return left&&right;
}

// standard ten-pin scoring off the flat roll list
function scoreTotal(){
  let s=0,i=0;
  for(let f=0; f<10 && i<rolls.length; f++){
    if(rolls[i]===10){                                   // strike
      s+=10+(rolls[i+1]||0)+(rolls[i+2]||0); i+=1;
    } else if((rolls[i]||0)+(rolls[i+1]||0)===10){       // spare
      s+=10+(rolls[i+2]||0); i+=2;
    } else {
      s+=(rolls[i]||0)+(rolls[i+1]||0); i+=2;
    }
  }
  return s;
}

function finalScore(){ return scoreTotal()+(megaWon?33:0); }
// per-frame view for the scoreboard: X for a Qu33ph, / for a spare, - for a miss
function frameView(){
  const out=[]; let i=0, run=0;
  const mark=(v)=> v===0 ? '-' : String(v);
  for(let f=0; f<10; f++){
    const cell={marks:['',''], total:null};
    if(i>=rolls.length){ out.push(cell); continue; }
    if(f<9){
      if(rolls[i]===10){
        cell.marks=['','X'];
        if(rolls[i+1]!==undefined&&rolls[i+2]!==undefined){ run+=10+rolls[i+1]+rolls[i+2]; cell.total=run; }
        i+=1;
      } else if(rolls[i+1]!==undefined && rolls[i]+rolls[i+1]===10){
        cell.marks=[mark(rolls[i]),'/'];
        if(rolls[i+2]!==undefined){ run+=10+rolls[i+2]; cell.total=run; }
        i+=2;
      } else if(rolls[i+1]!==undefined){
        cell.marks=[mark(rolls[i]),mark(rolls[i+1])];
        run+=rolls[i]+rolls[i+1]; cell.total=run;
        i+=2;
      } else {
        cell.marks=[mark(rolls[i]),''];        // first ball down, second still to come
        i+=1;
      }
    } else {
      const a=rolls[i], c=rolls[i+1], d=rolls[i+2];
      const m=[];
      if(a!==undefined) m.push(a===10?'X':mark(a));
      if(c!==undefined) m.push(c===10?'X':(a!==10&&a+c===10?'/':mark(c)));
      if(d!==undefined) m.push(d===10?'X':(c!==10&&a===10&&c+d===10?'/':mark(d)));
      cell.marks=m;
      const bonus=(a===10)||(a!==undefined&&c!==undefined&&a+c===10);
      const done= bonus ? (d!==undefined) : (a!==undefined&&c!==undefined);
      if(done){ run+=(a||0)+(c||0)+(d||0); cell.total=run; }
    }
    out.push(cell);
  }
  return out;
}
function say(text,col){ msg={t:text,c:col||T.accent}; msgT=95; }

// ─── throwing ─────────────────────────────────────────────────────────────
// No aim guide. You flick it, same as the real thing.
let touchStart=null, touchLast=null, touchT=0;
function localPt(e){
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX, y:t.clientY};
}
let aimAtDown=0;
function inBtn(p){ const r=oriBtn(); return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function onDown(e){
  if(phase!=='aim'||gameOver) return;
  e.preventDefault();
  const p=localPt(e);
  if(inBtn(p)){ orientIdx=(orientIdx+1)%ORIENTS.length;
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(_){}
    touchStart=null; return; }
  touchStart=p; touchLast=p; touchT=performance.now(); aimAtDown=aimX;
}
function onMove(e){
  if(!touchStart) return;
  e.preventDefault(); touchLast=localPt(e);
  // drag sideways to walk the marker along the foul line — the raw touch delta
  // needs flipping under mirror mode, since a physical rightward drag should
  // still walk the marker toward what's now visually the right side
  let dxRaw=touchLast.x-touchStart.x; if(mirrorMode) dxRaw=-dxRaw;
  aimX=Math.max(-0.72,Math.min(0.72, aimAtDown+dxRaw/AW*2.1));
}
function onUp(e){
  if(!touchStart||phase!=='aim'||gameOver){ touchStart=null; return; }
  e.preventDefault();
  const dt=Math.max(40,performance.now()-touchT);
  let dx=(touchLast.x-touchStart.x)/AW; if(mirrorMode) dx=-dx;
  const dy=(touchStart.y-touchLast.y)/AH;
  touchStart=null;
  if(dy<0.03) return;                    // only an upward flick rolls it; sideways just re-spots
  const power=Math.max(0.35,Math.min(1.35, dy*2.6*(260/dt)+0.35 ));
  throwBall(dx, power);
}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('mousedown',onDown); addEventListener('mousemove',onMove); addEventListener('mouseup',onUp);

// A marker is a cone, not a sphere: the cap end is fatter, so it always carves.
// BASE_HOOK is that built-in curve; the flick's sideways component adds to it.
const BASE_HOOK=-0.085;
// A marker's angle on the lane decides how hard the taper bites. Laid flat across
// the boards it tracks nearly straight; stood along the line it carves hardest but
// arrives thin, so it carries fewer markers through the deck.
const ORIENTS=[
  {id:'vertical',  label:'VERT',   rot:0,         hook:1.65, speed:0.93, carry:0.84},
  {id:'angled',    label:'ANGLED', rot:Math.PI/4, hook:1.00, speed:1.00, carry:1.00},
  {id:'horizontal',label:'FLAT',   rot:Math.PI/2, hook:0.42, speed:1.07, carry:1.18}
];
let orientIdx=1;
try{ const o=localStorage.getItem('qu33phOrientation');            // match the main game's default
     const k=ORIENTS.findIndex(x=>x.id===o); if(k>=0) orientIdx=k; }catch(e){}
function ORI(){ return ORIENTS[orientIdx]; }
// button lives just under the spotted marker
function oriBtn(){ const d=Math.min(AW*0.115,AH*0.062); return { x:ax(0.5)-d/2, y:ay(0.905)-d/2, w:d, h:d }; }
function throwBall(dx,power){
  const o=ORI();
  ball={ X: aimX, Y:0, vx: dx*1.7, vy: 3.5*power*o.speed,
         spin: (dx*1.5 + BASE_HOOK)*o.hook, rot:o.rot, carry:o.carry,
         col:queue[frame], live:true, wob:0 };
  phase='roll';
  sfxThrow();
}

// ─── simulation ───────────────────────────────────────────────────────────
let settleT=0;
function step(dt){
  if(phase==='roll'&&ball&&ball.live){
    // the hook bites hardest while the marker still has pace on it
    const grip=Math.min(1,ball.vy/2.2);
    ball.vx += ball.spin*grip*dt*2.4;
    ball.vy -= ball.vy*0.13*dt;                       // lane friction
    ball.X  += ball.vx*dt;  ball.Y += ball.vy*dt;
    ball.wob+= ball.vy*dt*7;                          // rolls on its axis, angle stays put
    const hw=ballHalfWidth(ball.rot);
    if(Math.abs(ball.X)>1.0-hw){                      // PEEF — in the gutter, roll is dead
      ball.X=Math.sign(ball.X)*(1.0-hw);
      ball.vx=0; ball.vy=0; ball.spin=0; ball.gutter=true;
      ball.live=false; settleT=0;                     // no bouncing out and carrying on
    }
    if(chair && !chair.shoved){
      if(capsuleHit(ball, chair.X, chair.Y, CHAIR_R)){
        if(Math.random()<MEGA_CHANCE){
          // the marker rides up off the chair and goes for the card
          const q=proj(ball.X,toV(ball.Y));
          megaFly={x0:q.x,y0:q.y,t:0}; ball.live=false; phase='mega';
          chair.shoved=true; chair.vy=0.7; sfx('mega');
        } else {
          // no jump — the chair just gets driven into the rack
          chair.shoved=true; chair.vy=Math.max(2.2,ball.vy*0.95); chair.vx=ball.vx*0.7;
          ball.vy*=0.55; sfxPin();
        }
      }
    }
    for(const p of pins){
      if(p.gone) continue;
      const c=capsuleHit(ball, p.X, p.Y, PIN_R);
      if(c){
        const nx=c.nx, ny=c.ny;
        const hit=Math.max(1.15, (ball.vy*0.80+Math.abs(ball.vx)*0.5)*(ball.carry||1));
        p.vx+=nx*hit; p.vy+=ny*hit;
        p.down=true; p.rot=(Math.random()-0.5)*0.5; p.vrot=(Math.random()-0.5)*9-Math.sign(nx)*3;
        ball.vx+= -nx*hit*0.09; ball.vy=Math.max(0.55,ball.vy-0.16);   // ploughs on through
        sfxPin();
      }
    }
    if(ball.Y>LANE_LEN+0.6 || ball.vy<0.22){ ball.live=false; settleT=0; }
  }
  // a shoved chair ploughs on into the rack
  if(chair && chair.shoved && phase!=='mega'){
    chair.X+=chair.vx*dt; chair.Y+=chair.vy*dt; chair.rot+=chair.vx*dt*2;
    chair.vy-=chair.vy*1.5*dt; chair.vx-=chair.vx*1.5*dt;
    for(const p of pins){
      if(p.gone||p.down) continue;
      if(Math.hypot(p.X-chair.X,p.Y-chair.Y)<CHAIR_R+PIN_R){
        const nx=(p.X-chair.X)||0.01, ny=(p.Y-chair.Y)||0.01, d=Math.hypot(nx,ny);
        const f=Math.max(1.2,chair.vy*0.8);
        p.vx+=nx/d*f; p.vy+=ny/d*f;
        p.down=true; p.rot=(Math.random()-0.5)*0.5; p.vrot=(Math.random()-0.5)*9;
        sfxPin();
      }
    }
    if(chair.Y>LANE_LEN+1.2) chair=null;
  }
  // the mega flight: marker leaves the lane and climbs to the card
  if(phase==='mega'&&megaFly){
    megaFly.t+=dt;
    if(megaFly.t>=1.05){
      megaWon=true; say('MEGA QU33PH','#ff4d3d'); sfx('quephe');
      megaFly=null; ball=null;
      // the throw itself still counts: whatever it left standing is scored normally
      endRoll(true);
    }
  }
  // pins keep going, knocking each other over
  for(const p of pins){
    if(p.gone) continue;
    if(Math.abs(p.vx)>0.001||Math.abs(p.vy)>0.001){
      p.X+=p.vx*dt; p.Y+=p.vy*dt;
      p.vx-=p.vx*1.9*dt; p.vy-=p.vy*1.9*dt;                            // pins carry further
      p.rot+=p.vrot*dt; p.vrot-=p.vrot*2.2*dt;
      if(p.down) p.sink=Math.min(1,p.sink+dt*2.4);
      for(const q of pins){
        if(q===p||q.gone) continue;
        const ddx=q.X-p.X, ddy=q.Y-p.Y, d=Math.hypot(ddx,ddy);
        if(d<PIN_R*2 && d>0.0001){
          const nx=ddx/d, ny=ddy/d, push=(PIN_R*2-d)*0.5;
          q.X+=nx*push; p.X-=nx*push; q.Y+=ny*push; p.Y-=ny*push;
          const t=Math.hypot(p.vx,p.vy)*0.92;                          // stronger chain reaction
          if(t>0.10){ q.vx+=nx*t; q.vy+=ny*t;
            if(!q.down){ q.down=true; q.rot=(Math.random()-0.5)*0.5; q.vrot=(Math.random()-0.5)*8; sfxPin(); } }
        }
      }
      if(Math.abs(p.X)>1.25||p.Y>LANE_LEN+1.1) p.gone=true;
    }
  }
  if(phase==='roll'&&ball&&!ball.live){
    settleT+=dt;
    let moving=false;
    // 0.14 stays safely above 0.109 — the velocity a pin needs to still knock a
    // neighbour over — so this calls it "stopped" once nothing can legitimately
    // topple anything else, rather than waiting for pins to fully stop sliding.
    // Matters less for sound now (crashes already played live as pins fell),
    // but still governs when the roll's final result/text appears.
    for(const p of pins) if(!p.gone && Math.hypot(p.vx,p.vy)>0.14) moving=true;
    if(!moving||settleT>1.3) endRoll();
  }
  if(msgT>0) msgT-=dt*60;
}

function rackFresh(){ rackPins(null); standingAtFrameStart=10; setChair(); }
// The chair only ever appears for the third ball of the tenth, and only onto a clean
// full rack. Chasing a spare doesn't earn it, so the mega can land exactly once and the
// ceiling is a perfect 300 plus 33.
function setChair(){
  chair = (frame===9 && roll===2 && standing()===10 && !megaWon)
    ? { X:0, Y:CHAIR_Y, vx:0, vy:0, shoved:false, rot:0 } : null;
}
function sweepAndStand(){                    // downed markers cleared, standing ones stay put
  for(const p of pins) if(p.down) p.gone=true;
  standingAtFrameStart=standing();
}
function readyNext(){ ball=null; phase='aim'; }
function endGame(){ gameOver=true; phase='over'; sfx('over'); saveHigh(); }

function endRoll(fromMega){
  if(phase==='mega'&&!fromMega) return;
  const felled=standingAtFrameStart-standing();
  const cleared=(standing()===0);
  rolls.push(felled);
  const strike=(felled===10);
  if(!fromMega){
    if(roll===0 && strike){ say('QU33PH\u2122','#ffd54a'); sfx('quephe'); }
    else if(roll>0 && cleared){ say('SPARE','#3fd07a'); sfx('mega'); }
    else if(felled===0 && ball && ball.gutter){ say('PEEF','#ff5a5a'); sfxPeef(); }
    else if(felled===6 && isWashout()){ say('WASHOUT','#ff8a2b'); sfxWashout(); }
  }
  if(frame<9){
    if(roll===0 && !strike){ roll=1; sweepAndStand(); setChair(); readyNext(); }
    else { frame++; roll=0; rackFresh(); readyNext(); }
    return;
  }
  // ── tenth frame: a strike or a spare buys the bonus rolls ──
  if(roll===0){
    roll=1;
    if(strike) rackFresh(); else sweepAndStand();
    setChair(); readyNext();
  } else if(roll===1){
    const openedWithStrike=(rolls[rolls.length-2]===10);
    if(openedWithStrike || cleared){ roll=2; rackFresh(); readyNext(); }
    else endGame();
  } else {
    endGame();
  }
}

// ─── galaxy starfield ─────────────────────────────────────────────────────
let starCv=null;
function starfield(w,h){
  if(starCv&&starCv.width===w&&starCv.height===h) return starCv;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  let seed=20260801;
  const rnd=()=>{ seed=(seed*1664525+1013904223)&0x7fffffff; return seed/0x7fffffff; };
  const pts=[], n=Math.round(w*h/1700);
  for(let i=0;i<n;i++){
    const px=rnd()*w, py=rnd()*h, r=rnd()*1.4+0.3;
    pts.push({x:px,y:py});
    x.globalAlpha=0.3+rnd()*0.65; x.fillStyle=rnd()<0.15?'#cbb6ff':'#fff';
    x.beginPath(); x.arc(px,py,r,0,7); x.fill();
  }
  x.globalAlpha=0.18; x.strokeStyle='#b892ff'; x.lineWidth=0.7;
  for(let k=0;k<6;k++){
    let cur=pts[(rnd()*pts.length)|0];
    x.beginPath(); x.moveTo(cur.x,cur.y);
    for(let s=0;s<3+((rnd()*3)|0);s++){
      let best=null,bd=1e9;
      for(const p of pts){ if(p===cur) continue;
        const d=Math.hypot(p.x-cur.x,p.y-cur.y); if(d<bd&&d>14){ bd=d; best=p; } }
      if(!best||bd>w*0.24) break;
      x.lineTo(best.x,best.y); cur=best;
    }
    x.stroke();
  }
  for(let g=0;g<2;g++){
    const gx=rnd()*w, gy=rnd()*h, gr=16+rnd()*20;
    x.save(); x.translate(gx,gy); x.rotate(rnd()*Math.PI); x.scale(1,0.42);
    for(let arm=0;arm<2;arm++){
      x.globalAlpha=0.28; x.strokeStyle='#d9c9ff'; x.lineWidth=1.4; x.beginPath();
      for(let t=0;t<Math.PI*2.4;t+=0.12){
        const rr=gr*(t/(Math.PI*2.4)), aa=t+arm*Math.PI;
        const sx=Math.cos(aa)*rr, sy=Math.sin(aa)*rr;
        t===0?x.moveTo(sx,sy):x.lineTo(sx,sy);
      }
      x.stroke();
    }
    x.globalAlpha=0.4; x.fillStyle='#fff6ff';
    x.beginPath(); x.arc(0,0,gr*0.14,0,7); x.fill(); x.restore();
  }
  starCv=c; return c;
}
let dotPat=null;
function benDay(){
  if(dotPat) return dotPat;
  const d=document.createElement('canvas'); d.width=d.height=6;
  const x=d.getContext('2d'); x.fillStyle='rgba(0,0,0,0.46)';
  x.beginPath(); x.arc(1.6,1.6,1.45,0,7); x.fill();

}

// ─── drawing ──────────────────────────────────────────────────────────────
// Markers are drawn full colour on top of the themed scene, same rule everywhere.
function drawMarker(img,cx,cy,h,rot,alpha,hot){
  if(!ready(img)) return;
  const w=h*((img.naturalWidth||img.width)/(img.naturalHeight||img.height));
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot);
  if(T.glow){
    // the live marker burns brighter than the rack — two passes so it really lifts
    ctx.shadowColor=T.glow; ctx.shadowBlur=h*(hot?0.95:0.45);
    if(hot){ ctx.drawImage(img,-w/2,-h/2,w,h); ctx.shadowBlur=h*0.55; }
  }
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

function drawPins(){
  const order=pins.slice().sort((a,b)=>b.Y-a.Y);   // furthest first, so near pins paint on top
  for(const p of order){
    if(p.gone) continue;
    const v=toV(p.Y);
    if(v<0||v>1.14) continue;
    const q=proj(p.X,Math.min(v,1.13));
    const h=AH*0.085*q.s*1.9;
    const img=MK[p.col];
    if(p.down){
      // knocked flat: lies across the lane and fades as it's swept
      drawMarker(img,q.x,q.y+h*0.16,h*0.92,Math.PI/2+p.rot,1-p.sink*0.55);
    } else {
      drawMarker(img,q.x,q.y-h*0.30,h,0);           // standing on its cap
    }
  }
}

// an oriented shadow matching the capsule, so what you see is what collides
function markerShadow(q,h,rot){
  ctx.save(); ctx.globalAlpha=0.38; ctx.fillStyle='#000';
  ctx.translate(q.x,q.y+h*0.09); ctx.rotate(-rot); ctx.scale(1,0.34);
  ctx.beginPath(); ctx.ellipse(0,0,h*0.14,h*0.46,0,0,7); ctx.fill();
  ctx.restore();
}
function drawBall(){
  if(!ball) return;
  const v=toV(ball.Y);
  if(v>1.16) return;
  const q=proj(ball.X,Math.max(0,Math.min(v,1.15)));
  const h=AH*0.085*q.s*1.75;
  // shadow grounds it on the lane
  markerShadow(q,h,ball.rot);
  // rolling marker lies on its side, spinning
  drawMarker(MK[ball.col],q.x,q.y-h*0.06,h*0.86,ball.rot+Math.sin(ball.wob)*0.10,undefined,true);
}

// the ten lights in the ball return = your ten frames, blue always in the last
function drawQueue(){
  const y=ay(RET_Y);
  const step=(RET_X1-RET_X0)/9;
  const h=AH*0.030;
  for(let i=0;i<10;i++){
    const x=ax(RET_X0+step*i);
    const done=i<frame, cur=(i===frame);
    if(cur){
      const pulse=0.55+0.45*Math.sin(performance.now()*0.006);
      ctx.save(); ctx.globalAlpha=pulse*0.85;
      ctx.fillStyle=T.accent; ctx.shadowColor=T.accent; ctx.shadowBlur=AH*0.022;
      ctx.beginPath(); ctx.arc(x,y,h*0.62,0,7); ctx.fill(); ctx.restore();
    }
    drawMarker(MK[queue[i]],x,y,cur?h*1.30:h*1.06,Math.PI/2, done?0.22:(cur?1:0.72));
  }
}

  ctx.font='bold '+Math.round(AH*0.028)+'px Helvetica,Arial,sans-serif';
  mtext(ctx,'HIGH '+high, ax(0.5), ay(0.50));
  mtext(ctx,'TAP TO PLAY AGAIN', ax(0.5), ay(0.56));
  ctx.restore();
}
cv.addEventListener('click',function(){ if(gameOver) newGame(); });
cv.addEventListener('touchend',function(){ if(gameOver) newGame(); },{passive:true});

function overlay(){
  if(T.stars){ ctx.save(); ctx.globalAlpha=0.95; ctx.globalCompositeOperation='screen';
    ctx.drawImage(starfield(Math.round(CW),Math.round(CH)),0,0); ctx.restore(); }
  if(T.wash){ ctx.save(); ctx.globalCompositeOperation='multiply';
    ctx.fillStyle=T.wash; ctx.fillRect(0,0,CW,CH); ctx.restore(); }
  if(T.dots){ ctx.save(); ctx.fillStyle=benDay(); ctx.fillRect(0,0,CW,CH); ctx.restore(); }
  if(T.vig){                                        // pull the corners down into the mood
    const g=ctx.createRadialGradient(CW*0.5,CH*0.48,Math.min(CW,CH)*0.20,
                                     CW*0.5,CH*0.48,Math.max(CW,CH)*0.72);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,'+T.vig+')');
    ctx.save(); ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH); ctx.restore();
  }
}

// ─── loop ─────────────────────────────────────────────────────────────────
let last=performance.now();
function frameLoop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,CW,CH);
  overlay();                 // themed wash sits under the markers
  drawPins(); drawBall(); drawChair(); drawMegaFly(); drawAimMarker(); drawQueue(); drawMegaCard(); drawOriBtn();
  drawHUD(); drawPrompt(); drawMsg(); drawOver();
  requestAnimationFrame(frameLoop);
}
resize(); newGame(); requestAnimationFrame(frameLoop);
</script>
