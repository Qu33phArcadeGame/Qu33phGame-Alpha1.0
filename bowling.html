<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Qu33ph Bowling</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #wrap{position:absolute;inset:0;overflow:hidden;}
  #bg{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;}
  #cv{position:absolute;top:0;left:0;display:block;}
</style>
</head>
<body>
<div id="wrap">
  <img id="bg" src="bowling.jpg?v=362" draggable="false" onerror="this.style.opacity=0.12">
  <canvas id="cv"></canvas>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  QU33PH BOWLING
//  Roll a marker down the lane at ten markers standing on their caps.
//  A marker's cap end is wider than its tail, so it never rolls straight —
//  you play the hook. Blue is always thrown last.
// ═══════════════════════════════════════════════════════════════════════════

// ─── lane geometry, measured off the cabinet art ──────────────────────────
// All normalised 0-1 against the CONTAIN-fitted background image, so they
// stay locked to the artwork at any screen size. Nudge these if the lane
// drifts off the painted wood.
const ART_W=1023, ART_H=1537;
const NEAR_Y=0.800, NEAR_HW=0.355;      // foul line (nearest edge of the wood)
const FAR_Y =0.360, FAR_HW =0.115;      // pin deck (where the lane goes dark)
const RET_Y =0.845;                     // the row of lights in the ball return
const RET_X0=0.2561, RET_X1=0.7111;     // first and last light centres
const HS_X=0.563, HS_Y=0.2411;          // beside the painted "High Score:" label
// the panel's gold frame runs 0.294-0.674, so the speaker boxes sit either side of it
const BOX_L=0.235, BOX_R=0.735, BOX_Y=0.2411, BOX_W=0.072;

// ─── themes: same five looks, same rules as every other cabinet ───────────
const THEME=(new URLSearchParams(location.search).get('theme')||'default').toLowerCase();
const LOOK={
  'default':{filter:'',                                                            wash:null,                     dots:false,stars:false,ink:'#ffffff',accent:'#ffd54a',glow:null},
  'cartoon':{filter:'grayscale(1) contrast(1.45) brightness(1.05)',                 wash:null,                     dots:true, stars:false,ink:'#ffffff',accent:'#ffffff',glow:null},
  'neon':   {filter:'saturate(1.7) contrast(1.2) brightness(0.92) hue-rotate(-12deg)',wash:'rgba(80,0,140,0.28)',   dots:false,stars:false,ink:'#8ffcff',accent:'#ff3df0',glow:'#ff3df0'},
  'sunset': {filter:'sepia(0.5) saturate(1.35) hue-rotate(-18deg) brightness(1.06)', wash:'rgba(255,138,40,0.18)', dots:false,stars:false,ink:'#fff0d6',accent:'#ffb347',glow:null},
  'galaxy': {filter:'saturate(0.85) brightness(0.72) hue-rotate(215deg) contrast(1.12)',wash:'rgba(20,10,60,0.32)',dots:false,stars:true, ink:'#e7e2ff',accent:'#b892ff',glow:'#b892ff'}
};
const T=LOOK[THEME]||LOOK['default'];
const COMIC=(THEME==='cartoon');
document.getElementById('bg').style.filter=T.filter;

// ─── marker art ───────────────────────────────────────────────────────────
function IMG(src){ const i=new Image(); i.src=src; return i; }
const MK={ red:IMG(COMIC?'redC.png':'red.png'),
           green:IMG(COMIC?'greenC.png':'green.png'),
           blue:IMG(COMIC?'blueC.png':'blue.png') };
const CHAIR=IMG('Chair.png');
const MEGACARD=IMG('megacard.png?v=364');
function ready(i){ return i && i.complete && i.naturalWidth>0; }

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let CW=0,CH=0,DPR=1;
// the background is object-fit:contain, so work out the letterboxed art box
let AX=0,AY=0,AW=0,AH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  CW=window.innerWidth; CH=window.innerHeight;
  cv.style.width=CW+'px'; cv.style.height=CH+'px';
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const s=Math.min(CW/ART_W,CH/ART_H);
  AW=ART_W*s; AH=ART_H*s; AX=(CW-AW)/2; AY=(CH-AH)/2;
  starCv=null;
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120));
// art-space normalised → screen pixels
function ax(n){ return AX+AW*n; }
function ay(n){ return AY+AH*n; }

// ─── lane projection ──────────────────────────────────────────────────────
// Lane space: u across (-1 left gutter .. +1 right gutter), v down (0 foul .. 1 pin deck).
// Reciprocal-depth scaling gives a true perspective narrowing.
const K=NEAR_HW/FAR_HW-1;
const S1=FAR_HW/NEAR_HW;
function scaleAt(v){ return 1/(1+v*K); }
function proj(u,v){
  const s=scaleAt(v);
  return { x: ax(0.5+u*NEAR_HW*s),
           y: ay(NEAR_Y+(FAR_Y-NEAR_Y)*(1-s)/(1-S1)),
           s: s };
}
// physical lane units for collision (u,v are display; X,Y are metric)
const LANE_LEN=7.0;
function toX(u){ return u; }
function toU(X){ return X; }
function toY(v){ return v*LANE_LEN; }
function toV(Y){ return Y/LANE_LEN; }

// ─── pins: ten markers standing on their caps ─────────────────────────────
const PIN_R=0.078, BALL_R=0.095;
const PIN_D=0.215, ROW_D=0.325, HEAD_Y=5.95;
const PIN_LAYOUT=[
  [0,0],
  [-PIN_D,1],[PIN_D,1],
  [-2*PIN_D,2],[0,2],[2*PIN_D,2],
  [-3*PIN_D,3],[-PIN_D,3],[PIN_D,3],[3*PIN_D,3]
];
// head pin is blue; the rest alternate so the triangle reads clearly
const PIN_COL=['blue','red','green','green','red','green','red','green','red','green'];

let pins=[];
function rackPins(keep){
  pins=PIN_LAYOUT.map(function(p,i){
    const alive = keep? (keep.indexOf(i)>=0) : true;
    return { i:i, X:p[0], Y:HEAD_Y+p[1]*ROW_D, vx:0, vy:0,
             col:PIN_COL[i], down:false, gone:!alive, rot:0, vrot:0, sink:0 };
  });
}

// ─── frames, queue and scoring ────────────────────────────────────────────
let queue=[];            // ten markers, one per frame — blue always last
let frame=0, roll=0;     // roll 0 = first ball of the frame
let rolls=[];            // pins felled, in order, for standard scoring
let ball=null, phase='aim', msg=null, msgT=0, gameOver=false;
let aimX=0;                              // where the next marker is spotted
let chair=null;                          // tenth frame only, sat in front of the rack
let megaBox='left', megaWon=false, megaFly=null;
const CHAIR_Y=HEAD_Y-0.62, CHAIR_R=0.135;
const MEGA_CHANCE=0.42;                  // otherwise the chair just barrels into the rack
let standingAtFrameStart=10;

function newGame(){
  queue=[];
  for(let i=0;i<9;i++) queue.push(Math.random()<0.5?'red':'green');
  queue.push('blue');                       // blue marker always thrown last
  frame=0; roll=0; rolls=[]; gameOver=false; aimX=0;
  megaBox=Math.random()<0.5?'left':'right'; megaWon=false; megaFly=null; chair=null;
  rackPins(null); ball=null; phase='aim'; msg=null;
  chair=null;
  standingAtFrameStart=10;
}

function standing(){ let n=0; for(const p of pins) if(!p.gone && !p.down) n++; return n; }

// standard ten-pin scoring off the flat roll list
function scoreTotal(){
  let s=0,i=0;
  for(let f=0; f<10 && i<rolls.length; f++){
    if(rolls[i]===10){                                   // strike
      s+=10+(rolls[i+1]||0)+(rolls[i+2]||0); i+=1;
    } else if((rolls[i]||0)+(rolls[i+1]||0)===10){       // spare
      s+=10+(rolls[i+2]||0); i+=2;
    } else {
      s+=(rolls[i]||0)+(rolls[i+1]||0); i+=2;
    }
  }
  return s;
}

function finalScore(){ return scoreTotal()+(megaWon?33:0); }
function say(text,col){ msg={t:text,c:col||T.accent}; msgT=95; }

// ─── throwing ─────────────────────────────────────────────────────────────
// No aim guide. You flick it, same as the real thing.
let touchStart=null, touchLast=null, touchT=0;
function localPt(e){
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX, y:t.clientY};
}
let aimAtDown=0;
function inBtn(p){ const r=oriBtn(); return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function onDown(e){
  if(phase!=='aim'||gameOver) return;
  e.preventDefault();
  const p=localPt(e);
  if(inBtn(p)){ orientIdx=(orientIdx+1)%ORIENTS.length;
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(_){}
    touchStart=null; return; }
  touchStart=p; touchLast=p; touchT=performance.now(); aimAtDown=aimX;
}
function onMove(e){
  if(!touchStart) return;
  e.preventDefault(); touchLast=localPt(e);
  // drag sideways to walk the marker along the foul line
  aimX=Math.max(-0.72,Math.min(0.72, aimAtDown+(touchLast.x-touchStart.x)/AW*2.1));
}
function onUp(e){
  if(!touchStart||phase!=='aim'||gameOver){ touchStart=null; return; }
  e.preventDefault();
  const dt=Math.max(40,performance.now()-touchT);
  const dx=(touchLast.x-touchStart.x)/AW, dy=(touchStart.y-touchLast.y)/AH;
  touchStart=null;
  if(dy<0.03) return;                    // only an upward flick rolls it; sideways just re-spots
  const power=Math.max(0.35,Math.min(1.35, dy*2.6*(260/dt)+0.35 ));
  throwBall(dx, power);
}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp,{passive:false});
cv.addEventListener('mousedown',onDown); addEventListener('mousemove',onMove); addEventListener('mouseup',onUp);

// A marker is a cone, not a sphere: the cap end is fatter, so it always carves.
// BASE_HOOK is that built-in curve; the flick's sideways component adds to it.
const BASE_HOOK=-0.085;
// A marker's angle on the lane decides how hard the taper bites. Laid flat across
// the boards it tracks nearly straight; stood along the line it carves hardest but
// arrives thin, so it carries fewer markers through the deck.
const ORIENTS=[
  {id:'vertical',  label:'VERT',   rot:Math.PI/2, hook:1.65, speed:0.93, carry:0.84},
  {id:'angled',    label:'ANGLED', rot:Math.PI/4, hook:1.00, speed:1.00, carry:1.00},
  {id:'horizontal',label:'FLAT',   rot:0,         hook:0.42, speed:1.07, carry:1.18}
];
let orientIdx=1;
try{ const o=localStorage.getItem('qu33phOrientation');            // match the main game's default
     const k=ORIENTS.findIndex(x=>x.id===o); if(k>=0) orientIdx=k; }catch(e){}
function ORI(){ return ORIENTS[orientIdx]; }
// button lives just under the spotted marker
function oriBtn(){ return { x:ax(0.5)-AW*0.105, y:ay(0.885), w:AW*0.21, h:AH*0.032 }; }
function throwBall(dx,power){
  const o=ORI();
  ball={ X: aimX, Y:0, vx: dx*1.7, vy: 3.5*power*o.speed,
         spin: (dx*1.5 + BASE_HOOK)*o.hook, rot:o.rot, carry:o.carry,
         col:queue[frame], live:true, wob:0 };
  phase='roll';
  sfx('roll');
}

// ─── simulation ───────────────────────────────────────────────────────────
let settleT=0;
function step(dt){
  if(phase==='roll'&&ball&&ball.live){
    // the hook bites hardest while the marker still has pace on it
    const grip=Math.min(1,ball.vy/2.2);
    ball.vx += ball.spin*grip*dt*2.4;
    ball.vy -= ball.vy*0.13*dt;                       // lane friction
    ball.X  += ball.vx*dt;  ball.Y += ball.vy*dt;
    ball.wob+= ball.vy*dt*7;                          // rolls on its axis, angle stays put
    if(Math.abs(ball.X)>1.0-BALL_R*0.5){              // PEEF — into the gutter
      ball.X=Math.sign(ball.X)*(1.0-BALL_R*0.5);
      ball.vx=0; ball.spin=0; ball.gutter=true;
    }
    if(chair && !chair.shoved){
      const cdx=chair.X-ball.X, cdy=chair.Y-ball.Y, cd=Math.hypot(cdx,cdy);
      if(cd<CHAIR_R+BALL_R){
        if(Math.random()<MEGA_CHANCE){
          // the marker rides up off the chair and goes for the card
          const q=proj(ball.X,toV(ball.Y));
          megaFly={x0:q.x,y0:q.y,t:0}; ball.live=false; phase='mega';
          chair.shoved=true; chair.vy=0.7; sfx('mega');
        } else {
          // no jump — the chair just gets driven into the rack
          chair.shoved=true; chair.vy=Math.max(2.2,ball.vy*0.95); chair.vx=ball.vx*0.7;
          ball.vy*=0.55; sfx('pin');
        }
      }
    }
    for(const p of pins){
      if(p.gone) continue;
      const ddx=p.X-ball.X, ddy=p.Y-ball.Y, d=Math.hypot(ddx,ddy);
      if(d<PIN_R+BALL_R && d>0.0001){
        const nx=ddx/d, ny=ddy/d;
        const hit=Math.max(0.6, (ball.vy*0.55+Math.abs(ball.vx)*0.4)*(ball.carry||1));
        p.vx+=nx*hit; p.vy+=ny*hit;
        p.down=true; p.rot=(Math.random()-0.5)*0.5; p.vrot=(Math.random()-0.5)*9-Math.sign(nx)*3;
        ball.vx+= -nx*hit*0.16; ball.vy=Math.max(0.4,ball.vy-0.30);
        sfx('pin');
      }
    }
    if(ball.Y>LANE_LEN+0.6 || ball.vy<0.22){ ball.live=false; settleT=0; }
  }
  // a shoved chair ploughs on into the rack
  if(chair && chair.shoved && phase!=='mega'){
    chair.X+=chair.vx*dt; chair.Y+=chair.vy*dt; chair.rot+=chair.vx*dt*2;
    chair.vy-=chair.vy*1.5*dt; chair.vx-=chair.vx*1.5*dt;
    for(const p of pins){
      if(p.gone||p.down) continue;
      if(Math.hypot(p.X-chair.X,p.Y-chair.Y)<CHAIR_R+PIN_R){
        const nx=(p.X-chair.X)||0.01, ny=(p.Y-chair.Y)||0.01, d=Math.hypot(nx,ny);
        const f=Math.max(1.2,chair.vy*0.8);
        p.vx+=nx/d*f; p.vy+=ny/d*f;
        p.down=true; p.rot=(Math.random()-0.5)*0.5; p.vrot=(Math.random()-0.5)*9;
        sfx('pin');
      }
    }
    if(chair.Y>LANE_LEN+1.2) chair=null;
  }
  // the mega flight: marker leaves the lane and climbs to the card
  if(phase==='mega'&&megaFly){
    megaFly.t+=dt;
    if(megaFly.t>=1.05){
      megaWon=true; say('MEGA QU33PH','#ff4d3d'); sfx('quephe');
      megaFly=null; ball=null;
      // the throw itself still counts: whatever it left standing is scored normally
      endRoll(true);
    }
  }
  // pins keep going, knocking each other over
  for(const p of pins){
    if(p.gone) continue;
    if(Math.abs(p.vx)>0.001||Math.abs(p.vy)>0.001){
      p.X+=p.vx*dt; p.Y+=p.vy*dt;
      p.vx-=p.vx*2.7*dt; p.vy-=p.vy*2.7*dt;
      p.rot+=p.vrot*dt; p.vrot-=p.vrot*2.2*dt;
      if(p.down) p.sink=Math.min(1,p.sink+dt*2.4);
      for(const q of pins){
        if(q===p||q.gone) continue;
        const ddx=q.X-p.X, ddy=q.Y-p.Y, d=Math.hypot(ddx,ddy);
        if(d<PIN_R*2 && d>0.0001){
          const nx=ddx/d, ny=ddy/d, push=(PIN_R*2-d)*0.5;
          q.X+=nx*push; p.X-=nx*push; q.Y+=ny*push; p.Y-=ny*push;
          const t=Math.hypot(p.vx,p.vy)*0.55;
          if(t>0.25){ q.vx+=nx*t; q.vy+=ny*t;
            if(!q.down){ q.down=true; q.rot=(Math.random()-0.5)*0.5; q.vrot=(Math.random()-0.5)*8; sfx('pin'); } }
        }
      }
      if(Math.abs(p.X)>1.25||p.Y>LANE_LEN+1.1) p.gone=true;
    }
  }
  if(phase==='roll'&&ball&&!ball.live){
    settleT+=dt;
    let moving=false;
    for(const p of pins) if(!p.gone && Math.hypot(p.vx,p.vy)>0.06) moving=true;
    if(!moving||settleT>2.6) endRoll();
  }
  if(msgT>0) msgT-=dt*60;
}

function endRoll(fromMega){
  if(phase==='mega'&&!fromMega) return;
  const felled=standingAtFrameStart-standing();
  rolls.push(felled);
  const tenth=(frame===9);
  if(roll===0 && felled===10){
    if(!fromMega){ say('QU33PH\u2122','#ffd54a'); sfx('quephe'); }
    nextFrame(tenth);
  } else if(roll===1 && standing()===0){
    if(!fromMega){ say('SPARE','#3fd07a'); sfx('mega'); }
    nextFrame(tenth);
  } else if(felled===0 && ball && ball.gutter && !fromMega){
    say('PEEF','#ff5a5a'); sfx('peef');
    afterOpen(tenth);
  } else {
    afterOpen(tenth);
  }
}
function afterOpen(tenth){
  if(roll===0){
    roll=1; standingAtFrameStart=standing();
    // downed markers are swept, the standing ones stay put
    for(const p of pins) if(p.down) p.gone=true;
    ball=null; phase='aim';
  } else {
    nextFrame(tenth);
  }
}
function nextFrame(tenth){
  if(tenth){ gameOver=true; phase='over'; sfx('over'); saveHigh(); return; }
  frame++; roll=0; rackPins(null); standingAtFrameStart=10; ball=null; phase='aim';
  // the chair only ever appears for the blue marker in the tenth
  chair = (frame===9) ? { X:0, Y:CHAIR_Y, vx:0, vy:0, shoved:false, rot:0 } : null;
}

// ─── high score ───────────────────────────────────────────────────────────
let high=0;
try{ high=parseInt(localStorage.getItem('qu33phBowlingHigh')||'0',10)||0; }catch(e){}
function saveHigh(){
  const s=finalScore();
  if(s>high){ high=s; try{ localStorage.setItem('qu33phBowlingHigh',String(high)); }catch(e){} }
}

// ─── sound hooks (files land later; silent until then) ────────────────────
const SFX={};
['roll','pin','quephe','mega','peef','over'].forEach(function(n){
  const a=new Audio('sfx/bowl_'+n+'.mp3'); a.preload='auto'; SFX[n]=a;
});
function sfx(n){ const a=SFX[n]; if(!a) return; try{ a.currentTime=0; a.play().catch(function(){}); }catch(e){} }

// ─── galaxy starfield ─────────────────────────────────────────────────────
let starCv=null;
function starfield(w,h){
  if(starCv&&starCv.width===w&&starCv.height===h) return starCv;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  let seed=20260801;
  const rnd=()=>{ seed=(seed*1664525+1013904223)&0x7fffffff; return seed/0x7fffffff; };
  const pts=[], n=Math.round(w*h/1700);
  for(let i=0;i<n;i++){
    const px=rnd()*w, py=rnd()*h, r=rnd()*1.4+0.3;
    pts.push({x:px,y:py});
    x.globalAlpha=0.3+rnd()*0.65; x.fillStyle=rnd()<0.15?'#cbb6ff':'#fff';
    x.beginPath(); x.arc(px,py,r,0,7); x.fill();
  }
  x.globalAlpha=0.18; x.strokeStyle='#b892ff'; x.lineWidth=0.7;
  for(let k=0;k<6;k++){
    let cur=pts[(rnd()*pts.length)|0];
    x.beginPath(); x.moveTo(cur.x,cur.y);
    for(let s=0;s<3+((rnd()*3)|0);s++){
      let best=null,bd=1e9;
      for(const p of pts){ if(p===cur) continue;
        const d=Math.hypot(p.x-cur.x,p.y-cur.y); if(d<bd&&d>14){ bd=d; best=p; } }
      if(!best||bd>w*0.24) break;
      x.lineTo(best.x,best.y); cur=best;
    }
    x.stroke();
  }
  for(let g=0;g<2;g++){
    const gx=rnd()*w, gy=rnd()*h, gr=16+rnd()*20;
    x.save(); x.translate(gx,gy); x.rotate(rnd()*Math.PI); x.scale(1,0.42);
    for(let arm=0;arm<2;arm++){
      x.globalAlpha=0.28; x.strokeStyle='#d9c9ff'; x.lineWidth=1.4; x.beginPath();
      for(let t=0;t<Math.PI*2.4;t+=0.12){
        const rr=gr*(t/(Math.PI*2.4)), aa=t+arm*Math.PI;
        const sx=Math.cos(aa)*rr, sy=Math.sin(aa)*rr;
        t===0?x.moveTo(sx,sy):x.lineTo(sx,sy);
      }
      x.stroke();
    }
    x.globalAlpha=0.4; x.fillStyle='#fff6ff';
    x.beginPath(); x.arc(0,0,gr*0.14,0,7); x.fill(); x.restore();
  }
  starCv=c; return c;
}
let dotPat=null;
function benDay(){
  if(dotPat) return dotPat;
  const d=document.createElement('canvas'); d.width=d.height=6;
  const x=d.getContext('2d'); x.fillStyle='rgba(0,0,0,0.28)';
  x.beginPath(); x.arc(1.6,1.6,1.15,0,7); x.fill();
  x.beginPath(); x.arc(4.6,4.6,1.15,0,7); x.fill();
  dotPat=ctx.createPattern(d,'repeat'); return dotPat;
}

// ─── drawing ──────────────────────────────────────────────────────────────
// Markers are drawn full colour on top of the themed scene, same rule everywhere.
function drawMarker(img,cx,cy,h,rot,alpha){
  if(!ready(img)) return;
  const w=h*(img.naturalWidth/img.naturalHeight);
  ctx.save();
  if(alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot);
  if(T.glow){ ctx.shadowColor=T.glow; ctx.shadowBlur=h*0.32; }
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}

function drawPins(){
  const order=pins.slice().sort((a,b)=>a.Y-b.Y);   // far pins behind near ones
  for(const p of order){
    if(p.gone) continue;
    const v=toV(p.Y);
    if(v<0||v>1.14) continue;
    const q=proj(p.X,Math.min(v,1.13));
    const h=AH*0.085*q.s*1.9;
    const img=MK[p.col];
    if(p.down){
      // knocked flat: lies across the lane and fades as it's swept
      drawMarker(img,q.x,q.y+h*0.16,h*0.92,p.rot,1-p.sink*0.55);
    } else {
      drawMarker(img,q.x,q.y-h*0.30,h,Math.PI/2);   // standing on its cap
    }
  }
}

function drawBall(){
  if(!ball) return;
  const v=toV(ball.Y);
  if(v>1.16) return;
  const q=proj(ball.X,Math.max(0,Math.min(v,1.15)));
  const h=AH*0.085*q.s*1.75;
  // shadow grounds it on the lane
  ctx.save(); ctx.globalAlpha=0.34; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(q.x,q.y+h*0.10,h*0.34,h*0.12,0,0,7); ctx.fill(); ctx.restore();
  // rolling marker lies on its side, spinning
  drawMarker(MK[ball.col],q.x,q.y-h*0.06,h*0.86,ball.rot+Math.sin(ball.wob)*0.10);
}

// the ten lights in the ball return = your ten frames, blue always in the last
function drawQueue(){
  const y=ay(RET_Y);
  const step=(RET_X1-RET_X0)/9;
  const h=AH*0.030;
  for(let i=0;i<10;i++){
    const x=ax(RET_X0+step*i);
    const done=i<frame, cur=(i===frame);
    if(cur){
      const pulse=0.55+0.45*Math.sin(performance.now()*0.006);
      ctx.save(); ctx.globalAlpha=pulse*0.85;
      ctx.fillStyle=T.accent; ctx.shadowColor=T.accent; ctx.shadowBlur=AH*0.022;
      ctx.beginPath(); ctx.arc(x,y,h*0.62,0,7); ctx.fill(); ctx.restore();
    }
    drawMarker(MK[queue[i]],x,y,cur?h*1.30:h*1.06,0, done?0.22:(cur?1:0.72));
  }
}

function drawHUD(){
  const f=Math.round(AH*0.026);
  ctx.save();
  ctx.font='bold '+f+'px Helvetica,Arial,sans-serif';
  ctx.textBaseline='top'; ctx.fillStyle=T.ink;
  // sit above the cabinet, clear of the marquee and the BACK button
  const topY=Math.max(CH*0.105, AY-AH*0.055);
  ctx.textAlign='left';  ctx.fillText('FRAME '+Math.min(frame+1,10)+'/10', ax(0.10), topY);
  ctx.textAlign='right'; ctx.fillText('SCORE '+finalScore(), ax(0.90), topY);
  // the high score goes in the cabinet's own painted readout
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='#ff4d3d';
  ctx.font='bold '+Math.round(AH*0.021)+'px Helvetica,Arial,sans-serif';
  if(T.glow){ ctx.shadowColor=T.glow; ctx.shadowBlur=AH*0.014; }
  ctx.fillText(String(high), ax(HS_X), ay(HS_Y));
  ctx.restore();
}

function drawMsg(){
  if(!msg||msgT<=0) return;
  const a=Math.min(1,msgT/34);
  ctx.save(); ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(AH*0.070)+'px Helvetica,Arial,sans-serif';
  ctx.lineWidth=Math.max(3,AH*0.006); ctx.strokeStyle='rgba(0,0,0,0.75)';
  if(T.glow){ ctx.shadowColor=msg.c; ctx.shadowBlur=AH*0.05; }
  ctx.strokeText(msg.t,ax(0.5),ay(0.50));
  ctx.fillStyle=msg.c; ctx.fillText(msg.t,ax(0.5),ay(0.50));
  ctx.restore();
}

function drawChair(){
  if(!chair||!ready(CHAIR)) return;
  const v=toV(chair.Y); if(v<0||v>1.16) return;
  const q=proj(chair.X,Math.min(v,1.15));
  const h=AH*0.085*q.s*2.3;
  const w=h*(CHAIR.naturalWidth/CHAIR.naturalHeight);
  ctx.save(); ctx.translate(q.x,q.y-h*0.34); if(chair.rot) ctx.rotate(chair.rot);
  if(T.glow){ ctx.shadowColor=T.glow; ctx.shadowBlur=h*0.3; }
  ctx.drawImage(CHAIR,-w/2,-h/2,w,h); ctx.restore();
}
// the mega target sits in one of the two boxes beside the High Score readout,
// and which box it takes is drawn fresh each game
function drawMegaCard(){
  if(!ready(MEGACARD)) return;
  const armed=(frame===9&&!megaWon);
  const cx=ax(megaBox==='left'?BOX_L:BOX_R), cy=ay(BOX_Y);
  const w=AW*BOX_W, h=w*(MEGACARD.naturalHeight/MEGACARD.naturalWidth);
  ctx.save();
  ctx.globalAlpha = megaWon?1 : (armed? 0.92+0.08*Math.sin(performance.now()*0.007) : 0.34);
  if(armed||megaWon){ ctx.shadowColor='#ff4d3d'; ctx.shadowBlur=AH*(megaWon?0.035:0.022); }
  ctx.drawImage(MEGACARD,cx-w/2,cy-h/2,w,h);
  ctx.restore();
}
function drawMegaFly(){
  if(!megaFly) return;
  const t=Math.min(1,megaFly.t/1.05), e=t*t*(3-2*t);
  const tx=ax(megaBox==='left'?BOX_L:BOX_R), ty=ay(BOX_Y);
  const x=megaFly.x0+(tx-megaFly.x0)*e;
  const arc=Math.sin(t*Math.PI)*AH*0.10;                 // lobs up on the way
  const y=megaFly.y0+(ty-megaFly.y0)*e-arc;
  drawMarker(MK.blue,x,y,AH*0.045*(1-t*0.45),t*10);
}
function drawOriBtn(){
  if(phase!=='aim'||gameOver) return;
  const r=oriBtn(), o=ORI();
  ctx.save();
  ctx.fillStyle='rgba(8,9,16,0.78)'; ctx.strokeStyle=T.accent; ctx.lineWidth=Math.max(1.2,AH*0.0018);
  const rad=r.h*0.42;
  ctx.beginPath();
  ctx.moveTo(r.x+rad,r.y); ctx.arcTo(r.x+r.w,r.y,r.x+r.w,r.y+r.h,rad);
  ctx.arcTo(r.x+r.w,r.y+r.h,r.x,r.y+r.h,rad); ctx.arcTo(r.x,r.y+r.h,r.x,r.y,rad);
  ctx.arcTo(r.x,r.y,r.x+r.w,r.y,rad); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=T.accent;
  ctx.font='bold '+Math.round(r.h*0.52)+'px Helvetica,Arial,sans-serif';
  ctx.fillText(o.label+'  \u21BB', r.x+r.w/2, r.y+r.h/2);
  ctx.restore();
}
function drawAimMarker(){
  if(phase!=='aim'||gameOver) return;
  const q=proj(aimX,0.012);
  const h=AH*0.085*q.s*1.75;
  ctx.save(); ctx.globalAlpha=0.34; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(q.x,q.y+h*0.10,h*0.34,h*0.12,0,0,7); ctx.fill(); ctx.restore();
  drawMarker(MK[queue[frame]],q.x,q.y-h*0.06,h*0.86,ORI().rot);
}
function drawPrompt(){
  if(phase!=='aim'||gameOver) return;
  const a=0.45+0.35*Math.sin(performance.now()*0.004);
  ctx.save(); ctx.globalAlpha=a;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=T.ink;
  ctx.font='bold '+Math.round(AH*0.024)+'px Helvetica,Arial,sans-serif';
  ctx.fillText(roll===0?'SLIDE TO AIM \u00b7 FLICK TO ROLL':'SPARE ATTEMPT', ax(0.5), ay(0.725));
  ctx.restore();
}

function drawOver(){
  if(!gameOver) return;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=T.accent;
  ctx.font='bold '+Math.round(AH*0.058)+'px Helvetica,Arial,sans-serif';
  ctx.fillText('FINAL '+finalScore(), ax(0.5), ay(0.44));
  ctx.fillStyle=T.ink;
  ctx.font='bold '+Math.round(AH*0.028)+'px Helvetica,Arial,sans-serif';
  ctx.fillText('HIGH '+high, ax(0.5), ay(0.50));
  ctx.fillText('TAP TO PLAY AGAIN', ax(0.5), ay(0.56));
  ctx.restore();
}
cv.addEventListener('click',function(){ if(gameOver) newGame(); });
cv.addEventListener('touchend',function(){ if(gameOver) newGame(); },{passive:true});

function overlay(){
  if(T.stars){ ctx.save(); ctx.globalAlpha=0.55; ctx.globalCompositeOperation='screen';
    ctx.drawImage(starfield(Math.round(CW),Math.round(CH)),0,0); ctx.restore(); }
  if(T.wash){ ctx.save(); ctx.fillStyle=T.wash; ctx.fillRect(0,0,CW,CH); ctx.restore(); }
  if(T.dots){ ctx.save(); ctx.fillStyle=benDay(); ctx.fillRect(0,0,CW,CH); ctx.restore(); }
}

// ─── loop ─────────────────────────────────────────────────────────────────
let last=performance.now();
function frameLoop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt);
  ctx.clearRect(0,0,CW,CH);
  overlay();                 // themed wash sits under the markers
  drawChair(); drawPins(); drawBall(); drawMegaFly(); drawAimMarker(); drawQueue(); drawMegaCard(); drawOriBtn();
  drawHUD(); drawPrompt(); drawMsg(); drawOver();
  requestAnimationFrame(frameLoop);
}
resize(); newGame(); requestAnimationFrame(frameLoop);
</script>
</body>
