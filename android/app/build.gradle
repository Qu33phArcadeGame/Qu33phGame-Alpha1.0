plugins {
    id("com.android.application")
}

android {
    namespace = "com.qu33ph.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.qu33ph.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 5
        versionName = "1.4"
    }

    signingConfigs {
        release {
            // Upload key for Google Play. Credentials come from the environment
            // (or ~/.gradle/gradle.properties) - never committed to the repo.
            def sf = System.getenv("QU33PH_STORE_FILE")
            if (sf) {
                storeFile = file(sf)
                storePassword = System.getenv("QU33PH_STORE_PASSWORD")
                keyAlias = System.getenv("QU33PH_KEY_ALIAS")
                keyPassword = System.getenv("QU33PH_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (System.getenv("QU33PH_STORE_FILE")) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            // Debug builds are auto-signed with the debug key: installable straight from the APK.
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// ---- offline bundle: copy the audited Season-1 site files from the repo
// root into the APK's assets/www. asset-list.txt is generated by the audit
// (one repo-root-relative path per line). Runs on every build, locally and
// on GitHub Actions.
def wwwListFile = file("asset-list.txt")
def wwwOutDir = layout.buildDirectory.dir("generated/www")
tasks.register("syncWwwAssets", Copy) {
    def repoRoot = file("../../")
    def includes = wwwListFile.readLines().collect { it.trim() }.findAll { it }
    from(repoRoot) {
        include(includes)
    }
    into(wwwOutDir)
    includeEmptyDirs = false
}
android.sourceSets.main.assets.srcDirs += [wwwOutDir]
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
    dependsOn("syncWwwAssets")
}
