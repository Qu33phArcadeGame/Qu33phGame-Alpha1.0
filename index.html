<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Qu33ph</title>
<style>
/* nobody gets to long-press/right-click-save any image in this app — the
   long-press "download/copy image" context menu on Android/iOS specifically
   comes from -webkit-touch-callout, so that's the one that actually matters
   on mobile; the rest are backup layers for desktop browsers. */
img,video{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-user-drag:none;-khtml-user-drag:none;-moz-user-select:none;-ms-user-select:none;
  pointer-events:auto;}

  html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  /* the real game lives in game.html, loaded here at a FIXED logical size —
     the iframe gets its own independent viewport at exactly DESIGN_W x DESIGN_H,
     so every vw/vh/dvh rule inside the whole app computes against that fixed
     size no matter what device or window this page is actually sitting in.
     We then just scale the iframe itself (as one solid block) to fit whatever
     real screen is available, centered, with letterboxing on whichever sides
     don't match — which is also what keeps it portrait-shaped automatically
     even inside a wide desktop browser window. */
  #stageOuter{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; }
  #gameFrame{ border:0; display:block; background:#000; transform-origin:center center; }
</style>
</head>
<body>
<script>
// belt-and-suspenders against saving/copying images — the CSS touch-callout
// rule above is what actually stops the mobile long-press menu; this catches
// the desktop right-click case and any image the CSS somehow missed.
document.addEventListener('contextmenu', function(e){
  var t = e.target;
  if(t && (t.tagName==='IMG' || t.tagName==='VIDEO')) e.preventDefault();
});
document.addEventListener('dragstart', function(e){
  var t = e.target;
  if(t && (t.tagName==='IMG' || t.tagName==='VIDEO')) e.preventDefault();
});
</script>

<div id="stageOuter">
  <iframe id="gameFrame" scrolling="no" allow="autoplay"></iframe>
</div>
<script>
// the one true "screen size" for the whole app — DESIGN_W is what every
// vw/vh/dvh rule in the game actually computes against, so this is the
// number that matters for layout. DESIGN_H is only a target for landscape/
// desktop letterboxing (see below) — portrait screens ignore it entirely.
var DESIGN_W = 420, DESIGN_H = 900;

// bump this by one every time you upload a new game.html so players (and
// you) actually get the update instead of a cached copy. Nobody ever sees
// this number — it's only used internally to build the iframe's URL, never
// shown in the address bar.
var GAME_VERSION = 1;
document.getElementById('gameFrame').src = 'game.html?v=' + GAME_VERSION;

// game.html is loaded fresh every time, not from Chrome's cache — otherwise
// updating game.html on the server and reloading the shell can still show
// the old cached copy inside the iframe, even with a cache-buster on the
// shell's own URL (that only busts the shell's cache, not the iframe's).


// mobile browsers resize the REAL usable viewport as the URL bar shows/hides
// (window.innerHeight can be stale right at load) — visualViewport is the
// more reliable source when it's available, and we re-check a few times
// after load/rotation to catch the browser chrome settling a moment later.
function getVW(){ return window.visualViewport ? window.visualViewport.width : window.innerWidth; }
function getVH(){ return window.visualViewport ? window.visualViewport.height : window.innerHeight; }

function fitStage(){
  var vw = getVW(), vh = getVH();
  var f = document.getElementById('gameFrame');
  var w, h, scale;
  if(vw <= vh){
    // portrait / phone-like — fill the screen completely. Width is still
    // locked to DESIGN_W internally (that's what fixes the layout bugs),
    // but the iframe's height flexes to whatever this device's actual
    // proportions are, so there's no wasted black space on ordinary phones.
    scale = vw / DESIGN_W;
    w = DESIGN_W;
    h = vh / scale;
  } else {
    // landscape / wide desktop window — fitting to width would squash
    // everything absurdly short, so fit to height instead and letterbox
    // the sides. This is the only case that should ever show bars.
    scale = vh / DESIGN_H;
    w = DESIGN_W;
    h = DESIGN_H;
  }
  f.width = w;
  f.height = h;
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.style.transform = 'scale(' + scale + ')';
}
fitStage();
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', function(){ setTimeout(fitStage, 60); setTimeout(fitStage, 350); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', fitStage);
  window.visualViewport.addEventListener('scroll', fitStage);
}
// catch the mobile browser chrome (URL bar) settling a moment after load
setTimeout(fitStage, 300);
setTimeout(fitStage, 1000);
</script>
</body>
</html>
